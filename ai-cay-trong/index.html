<style>

<script>
"use strict";
/* ================== DỮ LIỆU BÀI HỌC ================== */
const NHAN = {
  A: { ten: 'Lá khỏe mạnh', icon: '🌿', mau: '#16a34a', nhat: '#dcfce7', phim: '←' },
  B: { ten: 'Lá nhiễm bệnh', icon: '🦠', mau: '#ea580c', nhat: '#ffedd5', phim: '→' }
};
const DAC = [
  { k: 'mau',  ten: 'Màu sắc',    icon: '🎨', v: { xanh: 'Xanh tươi', vang: 'Vàng úa', nau: 'Nâu' } },
  { k: 'dom',  ten: 'Đốm bề mặt', icon: '🔍', v: { khong: 'Không đốm', tron: 'Đốm tròn', loang: 'Đốm loang' } },
  { k: 'vien', ten: 'Viền lá',    icon: '✂️', v: { phang: 'Phẳng', quan: 'Quăn queo', rach: 'Rách' } }
];
const MAUVAT = { xanh: '#22c55e', vang: '#eab308', nau: '#92400e', khong: '#e2e8f0', tron: '#57534e', loang: '#a8a29e', phang: '#93c5fd', quan: '#c4b5fd', rach: '#fca5a5' };

// Mẫu để dạy (Bước 1)
const MAU_DAY = [
  { id: 'cam',     ten: 'Lá cam xanh bóng',              mau: 'xanh', dom: 'khong', vien: 'phang', dang: 'oval', dung: 'A', bong: 1 },
  { id: 'lua',     ten: 'Lá lúa xanh thẳng',             mau: 'xanh', dom: 'khong', vien: 'phang', dang: 'dai',  dung: 'A' },
  { id: 'buoi',    ten: 'Lá bưởi non',                   mau: 'xanh', dom: 'khong', vien: 'phang', dang: 'oval', dung: 'A', la: ['#4d9a2c', '#a8e063', '#3b7a1f'] },
  { id: 'tao',     ten: 'Lá táo đọng giọt sương',        mau: 'xanh', dom: 'khong', vien: 'phang', dang: 'oval', dung: 'A', suong: 1 },
  { id: 'caixoan', ten: 'Lá cải xoăn tươi',              mau: 'xanh', dom: 'khong', vien: 'quan',  dang: 'tron', dung: 'A' },
  { id: 'bang',    ten: 'Lá bàng chuyển vàng tự nhiên',  mau: 'vang', dom: 'khong', vien: 'phang', dang: 'trung', dung: 'A' },
  { id: 'cachua',  ten: 'Lá cà chua đốm vàng',           mau: 'vang', dom: 'tron',  vien: 'phang', dang: 'oval', dung: 'B', domMau: '#4e342e' },
  { id: 'ot',      ten: 'Lá ớt xoăn ngọn',               mau: 'vang', dom: 'khong', vien: 'quan',  dang: 'oval', dung: 'B', w: 44 },
  { id: 'khoaitay',ten: 'Lá khoai tây cháy rìa nâu',     mau: 'nau',  dom: 'loang', vien: 'rach',  dang: 'tim',  dung: 'B', domMau: '#2b1608' },
  { id: 'chanh',   ten: 'Lá chanh bị nấm trắng',         mau: 'xanh', dom: 'loang', vien: 'phang', dang: 'oval', dung: 'B', domMau: '#f8fafc' },
  { id: 'hong',    ten: 'Lá hoa hồng đốm đen',           mau: 'xanh', dom: 'tron',  vien: 'phang', dang: 'oval', dung: 'B', domMau: '#111827' },
  { id: 'ngo',     ten: 'Lá ngô bị sâu ăn rách',         mau: 'xanh', dom: 'khong', vien: 'rach',  dang: 'dai',  dung: 'B' },
  { id: 'dualeo',  ten: 'Lá dưa leo vàng, đốm loang',    mau: 'vang', dom: 'loang', vien: 'quan',  dang: 'tron', dung: 'B', domMau: '#6b4423' }
];
// Mẫu mới đưa lên băng chuyền (Bước 3) – AI chưa từng thấy
const MAU_THU = [
  { id: 'phong',   ten: 'Lá phong mùa thu',              mau: 'vang', dom: 'khong', vien: 'phang', dang: 'phong', dung: 'A', la: ['#e8890c', '#ffc93c', '#b8650a'], batngo: 1,
    gc: 'Lá phong chuyển vàng cam vì <b>mùa thu</b> – hoàn toàn khỏe mạnh! Màu vàng không phải lúc nào cũng là bệnh.' },
  { id: 'chuoi',   ten: 'Lá chuối xanh mướt',            mau: 'xanh', dom: 'khong', vien: 'phang', dang: 'rong', dung: 'A', gc: 'Xanh, không đốm, viền lành → khỏe.' },
  { id: 'oi',      ten: 'Lá ổi đốm nâu',                 mau: 'xanh', dom: 'tron',  vien: 'phang', dang: 'oval', dung: 'B', domMau: '#5d4037',
    gc: 'Lá vẫn <b>xanh</b> nhưng có <b>đốm tròn</b> do nấm → bệnh. AI chỉ nhìn màu sẽ bỏ sót.' },
  { id: 'mongtoi', ten: 'Lá mồng tơi tươi',              mau: 'xanh', dom: 'khong', vien: 'phang', dang: 'tim',  dung: 'A', gc: 'Lá tươi, lành lặn → khỏe.' },
  { id: 'nho',     ten: 'Lá nho bị mốc loang',           mau: 'vang', dom: 'loang', vien: 'quan',  dang: 'tron', dung: 'B', domMau: '#7b5e3b', gc: 'Vàng, mốc loang, quăn → bệnh rõ.' },
  { id: 'bapcai',  ten: 'Lá bắp cải bị sâu ăn',          mau: 'xanh', dom: 'khong', vien: 'rach',  dang: 'tron', dung: 'B',
    gc: 'Màu xanh, không đốm, nhưng <b>viền rách</b> do sâu ăn → cây đang bị hại.' },
  { id: 'xoai',    ten: 'Lá xoài non màu nâu đỏ',        mau: 'nau',  dom: 'khong', vien: 'phang', dang: 'dai',  dung: 'A', w: 34, la: ['#8a3b1e', '#c9663a', '#6b2a12'], batngo: 1,
    gc: 'Lá xoài <b>non</b> tự nhiên có màu nâu đỏ, lớn lên mới xanh – khỏe mạnh!' },
  { id: 'san',     ten: 'Lá sắn khô cháy',               mau: 'nau',  dom: 'loang', vien: 'rach',  dang: 'tim',  dung: 'B', domMau: '#2b1608', gc: 'Nâu, cháy loang, rách → bệnh.' },
  { id: 'raumuong',ten: 'Lá rau muống tươi',             mau: 'xanh', dom: 'khong', vien: 'phang', dang: 'dai',  dung: 'A', w: 30, gc: 'Lá tươi → khỏe.' }
];
const BO_CHUAN = ['cam', 'lua', 'tao', 'caixoan', 'bang', 'cachua', 'khoaitay', 'chanh', 'hong', 'ngo'];
// Bẫy thiên kiến: dạy theo cảm tính “cứ xanh là khỏe, cứ vàng/nâu là bệnh”
const BO_BAY = ['cam', 'caixoan', 'chanh', 'hong', 'ngo', 'bang', 'cachua', 'ot', 'khoaitay', 'dualeo'];
const MUC_TIEU = 10;

/* ================== TRẠNG THÁI ================== */
let day = [];            // {s, nhan, nguon}
let hangDoi = [], viTri = 0;
let tab = 1;
let kq = [];             // kết quả lần kiểm thử gần nhất {s, du}
let lichSu = [];         // {ten, acc}
let soLanThu = 0, dangChay = false, dungLai = false;
let amThanh = true;
const byId = id => document.getElementById(id);
const tim = id => MAU_DAY.concat(MAU_THU).find(s => s.id === id);

/* ================== VẼ LÁ BẰNG SVG ================== */
let uid = 0;
function soNgauNhien(seed) { let x = seed % 2147483647; if (x <= 0) x += 2147483646; return () => (x = x * 16807 % 2147483647) / 2147483647; }
function bam(s) { let h = 7; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 1000003; return h + 11; }
const MAU_LA = { xanh: ['#2f8f3a', '#7ed36f', '#1f6b28'], vang: ['#d9a400', '#ffe066', '#a87d00'], nau: ['#6d3b1a', '#a8683a', '#47250f'] };
const HINH = {
  oval:  { w: 64, f: t => Math.pow(Math.sin(Math.PI * Math.pow(t, .85)), .8) },
  dai:   { w: 20, f: t => Math.pow(Math.sin(Math.PI * t), .35) * (1 - .45 * t) },
  tron:  { w: 78, f: t => Math.sqrt(Math.max(0, 1 - Math.pow(2 * t - 1, 2))) },
  tim:   { w: 74, f: t => Math.pow(Math.sin(Math.PI * Math.pow(t, .7)), .7) },
  trung: { w: 70, f: t => Math.pow(Math.sin(Math.PI * Math.pow(t, 1.5)), .75) },
  rong:  { w: 50, f: t => Math.pow(Math.sin(Math.PI * t), .28) }
};
function veLa(s, cao = 220) {
  const id = 'la' + (++uid), r = soNgauNhien(bam(s.id));
  const [dam, sang, gan] = s.la || MAU_LA[s.mau];
  const cx = 100, day0 = 210, ngon = 16, L = day0 - ngon;
  let pts = [], rongTai = null, gan2 = '';
  // khuyết rách
  const khuyet = [];
  if (s.vien === 'rach') for (let i = 0; i < 4; i++) khuyet.push({ c: .2 + r() * .6, w: .06 + r() * .05, d: .35 + r() * .35, ben: r() < .5 ? 1 : -1 });
  const pha = r() * 6;
  const mod = (t, ben) => {
    let m = 1;
    if (s.vien === 'quan') m *= 1 + .13 * Math.sin(t * Math.PI * 11 + pha + (ben > 0 ? 0 : 1.3));
    for (const k of khuyet) if (k.ben === ben) m *= 1 - k.d * Math.max(0, 1 - Math.abs(t - k.c) / k.w);
    return m;
  };
  if (s.dang === 'phong') {
    const cy = 116, R = 100, N = 220;
    for (let i = 0; i <= N; i++) {
      const p = -Math.PI + 2 * Math.PI * i / N; // p=0 là ngọn
      let rr = R * (.5 + .5 * Math.pow(Math.abs(Math.cos(2.5 * p)), 1.4)) * (1 - .3 * Math.max(0, -Math.cos(p)));
      rr *= 1 + .05 * Math.abs(Math.sin(14 * p));
      rr *= mod((p + Math.PI) / (2 * Math.PI), p >= 0 ? 1 : -1);
      pts.push([cx + rr * Math.sin(p), cy - rr * Math.cos(p)]);
    }
    rongTai = () => 45;
    for (const a of [0, 1.257, -1.257, 2.4, -2.4]) gan2 += `<line x1="${cx}" y1="${cy + 20}" x2="${(cx + 80 * Math.sin(a)).toFixed(1)}" y2="${(cy - 80 * Math.cos(a)).toFixed(1)}"/>`;
    gan2 += `<line x1="${cx}" y1="${cy + 20}" x2="${cx}" y2="236"/>`;
  } else {
    const h = HINH[s.dang], W = s.w || h.w, N = 70, phai = [], trai = [];
    rongTai = t => W * h.f(t);
    for (let i = 0; i <= N; i++) {
      const t = i / N, y = day0 - L * t, hw = W * h.f(t);
      phai.push([cx + hw * mod(t, 1), y]); trai.push([cx - hw * mod(t, -1), y]);
    }
    pts = phai.concat(trai.reverse());
    gan2 = `<path d="M${cx},236 L${cx},${day0} Q${cx + 3},${(day0 + ngon) / 2} ${cx},${ngon + 6}"/>`;
    for (let k = 1; k <= 6; k++) {
      const t = k / 7.2, y = day0 - L * t, hw = rongTai(t) * .82;
      gan2 += `<path d="M${cx},${y} Q${cx + hw * .5},${y - 6} ${(cx + hw).toFixed(1)},${(y - 16).toFixed(1)}"/><path d="M${cx},${y} Q${cx - hw * .5},${y - 6} ${(cx - hw).toFixed(1)},${(y - 16).toFixed(1)}"/>`;
    }
  }
  const d = 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('L') + 'Z';
  // vị trí ngẫu nhiên bên trong lá
  const diem = () => {
    if (s.dang === 'phong') { const a = r() * 6.28, rr = r() * 50; return [cx + rr * Math.sin(a), 105 - rr * Math.cos(a)]; }
    const t = .18 + r() * .64; return [cx + (r() * 2 - 1) * rongTai(t) * .65, day0 - L * t];
  };
  let dom = '';
  if (s.dom === 'tron') for (let i = 0; i < 9; i++) {
    const [x, y] = diem(), rr = 4 + r() * 7;
    dom += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(rr + 3).toFixed(1)}" fill="#facc15" opacity=".55"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rr.toFixed(1)}" fill="${s.domMau || '#3e2723'}"/>`;
  }
  if (s.dom === 'loang') for (let i = 0; i < 4; i++) {
    const [x, y] = diem(), R0 = 14 + r() * 16; let p = '';
    for (let j = 0; j < 9; j++) { const a = j / 9 * 6.283, rr = R0 * (.55 + r() * .6); p += (j ? 'L' : 'M') + (x + rr * Math.cos(a)).toFixed(1) + ',' + (y + rr * Math.sin(a)).toFixed(1); }
    dom += `<path d="${p}Z" fill="${s.domMau || '#5d4037'}" opacity=".78" stroke="${s.domMau || '#5d4037'}" stroke-width="6" stroke-linejoin="round"/>`;
  }
  let them = '';
  if (s.suong) for (let i = 0; i < 5; i++) { const [x, y] = diem(); them += `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="5" ry="6.5" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.2" opacity=".95"/><circle cx="${(x - 1.6).toFixed(1)}" cy="${(y - 2.4).toFixed(1)}" r="1.6" fill="#fff"/>`; }
  if (s.bong || s.dung === 'A') them += `<ellipse cx="78" cy="90" rx="16" ry="44" fill="#fff" opacity=".16" transform="rotate(-18 78 90)"/>`;
  return `<svg class="la-svg" viewBox="0 0 200 240" width="${cao * 200 / 240}" height="${cao}" role="img" aria-label="${s.ten}">
    <defs><linearGradient id="${id}g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${sang}"/><stop offset="1" stop-color="${dam}"/></linearGradient>
    <clipPath id="${id}c"><path d="${d}"/></clipPath></defs>
    <line x1="100" y1="${s.dang === 'phong' ? 140 : 200}" x2="100" y2="238" stroke="${gan}" stroke-width="5" stroke-linecap="round"/>
    <path d="${d}" fill="url(#${id}g)" stroke="${gan}" stroke-width="2.5" stroke-linejoin="round"/>
    <g clip-path="url(#${id}c)"><g fill="none" stroke="${gan}" stroke-width="2.2" stroke-linecap="round" opacity=".55">${gan2}</g>${dom}${them}</g>
  </svg>`;
}

/* ================== MÔ HÌNH AI (Naive Bayes) ================== */
function moHinh() {
  const n = { A: 0, B: 0 }, dem = { A: {}, B: {} };
  for (const t of day) { n[t.nhan]++; for (const f of DAC) { const k = f.k + ':' + t.s[f.k]; dem[t.nhan][k] = (dem[t.nhan][k] || 0) + 1; } }
  const w = {}, tamAnh = {};
  for (const f of DAC) {
    const ds = Object.keys(f.v); w[f.k] = {};
    for (const v of ds) {
      const k = f.k + ':' + v;
      const pa = ((dem.A[k] || 0) + 1) / (n.A + ds.length), pb = ((dem.B[k] || 0) + 1) / (n.B + ds.length);
      w[f.k][v] = Math.log(pa / pb);
    }
    const ws = Object.values(w[f.k]); tamAnh[f.k] = Math.max(...ws) - Math.min(...ws);
  }
  const tong = Object.values(tamAnh).reduce((a, b) => a + b, 0) || 1;
  const tiLe = {}; for (const f of DAC) tiLe[f.k] = tamAnh[f.k] / tong;
  return { n, dem, w, tiLe, tien: Math.log((n.A + 1) / (n.B + 1)) };
}
function duDoan(m, s) {
  let z = m.tien;
  const phan = DAC.map(f => ({ f, v: s[f.k], w: m.w[f.k][s[f.k]] }));
  for (const p of phan) z += p.w;
  const pA = 1 / (1 + Math.exp(-z));
  return { nhan: pA >= .5 ? 'A' : 'B', pA, tin: Math.max(pA, 1 - pA), phan: phan.slice().sort((a, b) => Math.abs(b.w) - Math.abs(a.w)) };
}
function mucDo(w) { const a = Math.abs(w); return a < .08 ? 'gần như không' : a < .5 ? 'nhẹ' : a < 1.1 ? 'vừa' : 'mạnh'; }
function giaiThich(d) {
  return d.phan.slice(0, 2).map(p => {
    const huong = p.w >= 0 ? 'A' : 'B';

        <div id="bang" class="bang absolute inset-x-0 bottom-[44px] h-[26px] border-y-4 border-slate-700"></div>
        <div id="cong" class="absolute left-1/2 -translate-x-1/2 bottom-[70px] w-[190px] h-[215px]">
          <div class="cong-vien absolute inset-0 border-[10px] border-b-0 border-indigo-600 rounded-t-[60px] transition-shadow"></div>
          <div class="absolute -top-1 left-1/2 -translate-x-1/2 bg-indigo-600 text-white text-sm font-extrabold px-3 py-1 rounded-full whitespace-nowrap shadow">🤖 CỔNG AI</div>
          <div class="laser absolute left-[10px] right-[10px] h-[4px] bg-rose-500 rounded-full" style="top:12%;box-shadow:0 0 12px 3px #f43f5e"></div>
        </div>
        <div id="vat" class="vat absolute bottom-[66px]" style="left:-200px"></div>
      </div>
      <div class="grid grid-cols-2 gap-4 mt-4">
        ${['A', 'B'].map(n => `<div class="rounded-3xl border-4 border-dashed p-3 min-h-[130px]" style="border-color:${NHAN[n].mau};background:${NHAN[n].nhat}">
          <div class="font-extrabold text-lg" style="color:${NHAN[n].mau}">🧺 Khay ${NHAN[n].icon} ${NHAN[n].ten}</div>
          <div id="khay${n}" class="flex flex-wrap gap-2 mt-2">${kq.filter(k => k.du.nhan === n).map(k => oKhay(k)).join('')}</div></div>`).join('')}
      </div>
    </div>
    <aside class="flex flex-col gap-4">
      <div class="bg-white rounded-3xl shadow p-4">
        <div class="flex gap-2">
          <button id="chay-het" class="flex-1 rounded-2xl py-3 font-extrabold text-white bg-indigo-600 hover:bg-indigo-700 shadow">▶ Chạy tự động</button>
          <button id="chay-1" class="flex-1 rounded-2xl py-3 font-extrabold text-indigo-700 bg-indigo-100 hover:bg-indigo-200">⏭ Từng mẫu</button>
        </div>
        <button id="thu-lai" class="w-full mt-2 rounded-xl py-2 font-semibold bg-slate-100 hover:bg-slate-200 text-slate-600">↺ Đưa lá trở lại, kiểm thử lại</button>
      </div>
      <div id="khung-du" class="bg-white rounded-3xl shadow p-4 min-h-[230px]">
        <div class="text-slate-400 text-center mt-10">Bấm <b>▶ Chạy tự động</b> để bắt đầu.</div>
      </div>
      <div class="bg-white rounded-3xl shadow p-4">
        <div class="flex justify-between font-bold"><span>🎯 Độ chính xác</span><span id="acc">${xong ? Math.round(dung / xong * 100) + '%' : '–'}</span></div>
        <div class="h-4 bg-slate-100 rounded-full mt-2 overflow-hidden"><div id="acc-thanh" class="thanh h-full rounded-full bg-gradient-to-r from-amber-400 to-green-600" style="width:${xong ? dung / xong * 100 : 0}%"></div></div>
        <div class="text-sm text-slate-500 mt-1" id="acc-ct">${xong ? `Đúng ${dung}/${xong} mẫu` : ''}</div>
      </div>
      <div id="nut-b4">${xong === MAU_THU.length ? nutTiep(4, '🔧 Đánh giá & dạy lại') : ''}</div>
    </aside>
  </div>`;
  byId('chay-het').onclick = () => chay(true);
  byId('chay-1').onclick = () => chay(false);
  byId('thu-lai').onclick = () => { if (dangChay) { dungLai = true; return; } kq = []; veB3(); };
}
function oKhay(k) {
  const ok = k.du.nhan === k.s.dung;
  return `<div class="nay relative bg-white rounded-xl p-1 w-[66px] text-center shadow-sm" title="${k.s.ten}">${veLa(k.s, 48)}
    <span class="absolute -top-2 -right-2 w-6 h-6 rounded-full grid place-items-center text-white text-sm font-bold ${ok ? 'bg-green-600' : 'bg-red-600'}">${ok ? '✓' : '✗'}</span>
    <div class="text-[10px] leading-tight truncate">${k.s.ten.replace(/^Lá /, '')}</div></div>`;
}
async function chay(tuDong) {
  if (dangChay) { if (tuDong) dungLai = true; return; }
  if (kq.length >= MAU_THU.length) { kq = []; veB3(); }
  dangChay = true; dungLai = false;
  const m = moHinh();
  do {
    const s = MAU_THU[kq.length], vat = byId('vat'), bang = byId('bang');
    if (!vat) break;
    byId('chay-het').textContent = tuDong ? '⏸ Tạm dừng' : '▶ Chạy tự động';
    vat.style.transition = 'none'; vat.style.left = '-200px'; vat.style.transform = 'none'; vat.style.opacity = 1;
    vat.innerHTML = veLa(s, 150) + `<div class="text-center text-xs font-bold bg-white/80 rounded-full px-2 mt-1">${s.ten}</div>`;
    void vat.offsetWidth; vat.style.transition = '';
    bang.classList.add('chay'); tieng(300, .4, 'sawtooth', .02);
    vat.style.left = 'calc(50% - 62px)';
    await ngu(1150); if (!byId('canh')) break;
    bang.classList.remove('chay');
    byId('cong').classList.add('quet'); tieng(1200, .5, 'triangle', .03);
    byId('khung-du').innerHTML = `<div class="text-center mt-12 text-indigo-600 font-bold text-lg animate-pulse">🔴 AI đang quét “${s.ten}”…</div>`;
    await ngu(1900); if (!byId('canh')) break;
    byId('cong').classList.remove('quet');
    const d = duDoan(m, s), ok = d.nhan === s.dung;
    byId('khung-du').innerHTML = `
      <div class="the-dt">
        <div class="text-sm text-slate-500">AI dự đoán <b>${s.ten}</b> là:</div>
        <div class="text-2xl font-extrabold mt-1" style="color:${NHAN[d.nhan].mau}">${NHAN[d.nhan].icon} ${NHAN[d.nhan].ten}</div>
        <div class="flex justify-between text-sm font-semibold mt-3"><span>Độ tự tin</span><span>${Math.round(d.tin * 100)}%</span></div>
        <div class="h-3 bg-slate-100 rounded-full overflow-hidden"><div class="thanh h-full rounded-full" style="width:${d.tin * 100}%;background:${NHAN[d.nhan].mau}"></div></div>
        <div class="mt-3 font-bold text-sm">💡 Vì sao AI đoán như vậy?</div>
        <ul class="text-sm list-disc pl-5 mt-1 space-y-1">${giaiThich(d)}</ul>
        <div class="mt-3 rounded-xl px-3 py-2 font-bold ${ok ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
          ${ok ? '✓ Bác nông dân: ĐÚNG!' : `✗ Bác nông dân: SAI! Thật ra đây là “${NHAN[s.dung].ten}”.`}${s.batngo && !ok ? ' <span class="block font-semibold text-sm mt-1">⭐ Mẫu gây bất ngờ!</span>' : ''}</div>
      </div>`;
    ok ? tiengDung() : tiengSai();
    vat.classList.add(d.nhan === 'A' ? 'bay-A' : 'bay-B');
    await ngu(480);
    vat.classList.remove('bay-A', 'bay-B'); vat.style.opacity = 0;
    const k = { s, du: d }; kq.push(k);
    byId('khay' + d.nhan).insertAdjacentHTML('beforeend', oKhay(k));
    const dung = kq.filter(x => x.du.nhan === x.s.dung).length;
    byId('dem').textContent = kq.length;
    byId('acc').textContent = Math.round(dung / kq.length * 100) + '%';
    byId('acc-thanh').style.width = dung / kq.length * 100 + '%';
    byId('acc-ct').textContent = `Đúng ${dung}/${kq.length} mẫu`;
    if (kq.length === MAU_THU.length) {
      soLanThu++;
      const acc = Math.round(dung / kq.length * 100);
      lichSu.push({ ten: 'Kiểm thử lần ' + soLanThu, acc, n: day.length });
      byId('nut-b4').innerHTML = nutTiep(4, '🔧 Đánh giá & dạy lại');
      bao(`🏁 Xong! Độ chính xác của AI: <b>${acc}%</b>. ${acc < 80 ? 'Sang Bước 4 để sửa lỗi cho AI.' : 'Rất tốt! Xem chi tiết ở Bước 4.'}`, 4000);
      break;
    }
    if (tuDong) await ngu(1400);
  } while (tuDong && !dungLai);
  dangChay = false;
  const n = byId('chay-het'); if (n) n.textContent = kq.length && kq.length < MAU_THU.length ? '▶ Chạy tiếp' : '▶ Chạy tự động';
  const b = byId('bang'); if (b) b.classList.remove('chay');
}

/* ================== BƯỚC 4: ĐÁNH GIÁ & DẠY LẠI ================== */
let vuaSua = null;
function veB4() {
  if (!lichSu.length) { byId('b4').innerHTML = trongRong('Chưa có kết quả kiểm thử', 'Hãy cho các mẫu lá chạy qua băng chuyền ở Bước 3 trước.', 3); return; }
  const m = moHinh();
  const ds = MAU_THU.map(s => ({ s, d: duDoan(m, s) }));
  const dung = ds.filter(x => x.d.nhan === x.s.dung).length, acc = Math.round(dung / ds.length * 100);
  const max = Math.max(...lichSu.map(l => l.acc), 1);
  byId('b4').innerHTML = `
  <div class="bg-rose-50 border-2 border-rose-200 rounded-2xl px-4 py-3 mb-4 text-base">
    <b>Đánh giá:</b> Mẫu <span class="text-green-700 font-bold">xanh</span> = AI đoán đúng, mẫu <span class="text-red-700 font-bold">đỏ</span> = AI đoán sai.
    Bấm <b>“🔧 Sửa lỗi & Dạy lại”</b> ở mẫu sai để dạy AI đáp án đúng – trọng số bộ não AI được tính lại ngay và cả danh sách được chấm lại.
  </div>
  <div class="grid lg:grid-cols-[1fr_320px] gap-5">
    <div class="flex flex-col gap-3">${ds.map(({ s, d }) => {
      const ok = d.nhan === s.dung, moi = vuaSua && vuaSua.truoc[s.id] !== undefined && vuaSua.truoc[s.id] !== ok;
      return `<div class="${moi ? 'nay ring-4 ring-yellow-300' : ''} rounded-2xl border-2 p-3 flex flex-wrap sm:flex-nowrap gap-3 items-center ${ok ? 'border-green-300 bg-green-50' : 'border-red-300 bg-red-50'}">
        <div class="shrink-0 bg-white rounded-xl p-1">${veLa(s, 84)}</div>
        <div class="flex-1 min-w-[200px]">
          <div class="font-extrabold text-lg">${s.ten} ${s.batngo ? '<span class="text-xs bg-yellow-300 text-yellow-900 rounded-full px-2 py-0.5 align-middle">⭐ Mẫu gây bất ngờ</span>' : ''}</div>
          ${theDac(s, 1)}
          <div class="text-sm mt-1.5">AI đoán: ${huyHieu(d.nhan)} <span class="text-slate-500">(${Math.round(d.tin * 100)}% tự tin)</span> · Đáp án: ${huyHieu(s.dung)}</div>
          ${!ok || s.batngo ? `<div class="text-sm text-slate-600 mt-1">📝 ${s.gc}</div>` : ''}
        </div>
        <div class="shrink-0 text-center">${ok
          ? '<div class="text-green-700 font-extrabold text-lg">✓ Đúng</div>'
          : `<div class="text-red-700 font-extrabold text-lg mb-1">✗ Sai</div><button data-sua="${s.id}" class="rounded-xl px-3 py-2 font-bold text-white bg-red-600 hover:bg-red-700 shadow">🔧 Sửa lỗi & Dạy lại</button>`}</div>
      </div>`; }).join('')}
    </div>
    <aside class="flex flex-col gap-4">
      <div class="bg-white rounded-3xl shadow p-4 text-center">
        <div class="font-bold">🎯 Độ chính xác hiện tại</div>
        <div class="text-5xl font-extrabold mt-1 ${acc >= 80 ? 'text-green-600' : acc >= 60 ? 'text-amber-500' : 'text-red-600'}">${acc}%</div>
        <div class="text-sm text-slate-500">Đúng ${dung}/${ds.length} mẫu · AI đã học ${day.length} mẫu</div>
        ${acc === 100 ? '<div class="mt-2 text-green-700 font-bold">🏆 Tuyệt vời! AI đã phân loại đúng tất cả.</div>' : ''}
      </div>
      <div class="bg-white rounded-3xl shadow p-4">
        <div class="font-bold mb-2">📈 Sự tiến bộ của AI</div>
        <div class="flex items-end gap-2 h-40 border-b-2 border-slate-300 px-1">${lichSu.map((l, i) => `
          <div class="flex-1 flex flex-col items-center justify-end h-full" title="${l.ten}: ${l.acc}%">
            <span class="text-xs font-bold">${l.acc}%</span>
            <div class="thanh w-full rounded-t-lg ${i === lichSu.length - 1 ? 'bg-green-500' : 'bg-slate-300'}" style="height:${l.acc / Math.max(100, max) * 100}%"></div></div>`).join('')}
        </div>
        <div class="flex gap-2 px-1 mt-1">${lichSu.map((l, i) => `<div class="flex-1 text-[10px] text-center text-slate-500 leading-tight">${i === 0 ? 'Lần đầu' : 'Sửa ' + i}</div>`).join('')}</div>
      </div>
      <div class="bg-amber-50 border-2 border-amber-200 rounded-3xl p-4 text-sm">
        <div class="font-bold text-base mb-1">💬 Bài học rút ra</div>
        <ul class="list-disc pl-5 space-y-1">
          <li>AI <b>chỉ biết những gì được dạy</b>: dữ liệu lệch → AI “học vẹt”, có <b>thiên kiến</b>.</li>
          <li>Dữ liệu tốt phải <b>đủ nhiều, cân bằng, đa dạng</b> (cả lá vàng khỏe, lá xanh bệnh…).</li>
          <li>Con người cần <b>kiểm tra và sửa lỗi</b> cho AI; nên thử lại trên những mẫu <b>mới</b>.</li>
        </ul>
      </div>
      <div class="flex flex-col gap-2">
        <button onclick="moTab(2)" class="rounded-2xl px-4 py-2.5 font-bold bg-sky-100 hover:bg-sky-200 text-sky-800">🧠 Xem trọng số mới</button>
        <button onclick="kq=[];moTab(3)" class="rounded-2xl px-4 py-2.5 font-bold bg-indigo-100 hover:bg-indigo-200 text-indigo-800">🏭 Chạy lại băng chuyền</button>
      </div>
    </aside>
  </div>`;
}
byId('b4').addEventListener('click', e => {
  const b = e.target.closest('[data-sua]'); if (!b) return;
  const s = tim(b.dataset.sua), m0 = moHinh(), truoc = {};
  MAU_THU.forEach(x => truoc[x.id] = duDoan(m0, x).nhan === x.dung);
  const acc0 = Math.round(Object.values(truoc).filter(Boolean).length / MAU_THU.length * 100);
  day.push({ s, nhan: s.dung, nguon: 'sua' });
  const m1 = moHinh(), ok1 = duDoan(m1, s).nhan === s.dung;
  const acc1 = Math.round(MAU_THU.filter(x => duDoan(m1, x).nhan === x.dung).length / MAU_THU.length * 100);
  lichSu.push({ ten: 'Sau khi sửa ' + s.ten, acc: acc1, n: day.length });
  vuaSua = { truoc };
  ok1 ? tiengDung() : tieng(520, .15);
  bao(`🔧 AI đã học thêm: <b>${s.ten}</b> = ${NHAN[s.dung].ten}. Độ chính xác: <b>${acc0}% → ${acc1}%</b>${ok1 ? '' : '<br>AI vẫn chưa đổi ý – dạy thêm lần nữa để tăng trọng số!'}`, 4200);
  veB4();
});

/* ================== PHÍM TẮT & KHỞI ĐỘNG ================== */
document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea')) return;
  if (tab === 1 && e.key === 'ArrowLeft') { e.preventDefault(); dayMau('A'); }
  else if (tab === 1 && e.key === 'ArrowRight') { e.preventDefault(); dayMau('B'); }
  else if (tab === 3 && e.key === ' ') { e.preventDefault(); chay(false); }
  else if (/^[1-4]$/.test(e.key) && !e.ctrlKey && !e.altKey) moTab(+e.key);
});
byId('nut-am').onclick = e => { amThanh = !amThanh; e.currentTarget.textContent = amThanh ? '🔊' : '🔇'; };
byId('nut-toan').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); };
moTab(1);
</script>
</body>
</html>
