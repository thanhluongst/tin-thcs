/* ===================== HẾT KỊCH BẢN ===================== */

/* ================== TRẠNG THÁI ================== */
const { NHAN, DAC, MAUVAT, MAU_DAY, MAU_THU, BO_CHUAN, BO_BAY } = CANH, CHU = CANH.chu;
const MUC_TIEU = 10;
const veMau = (s, cao) => CANH.ve(s, cao);
const tenNgan = s => s.ngan || s.ten.replace(/^Lá /, '');
let day = [], hangDoi = [], viTri = 0, tab = 1, kq = [], lichSu = [];
let soLanThu = 0, dangChay = false, dungLai = false, amThanh = true;
const byId = id => document.getElementById(id);
const tim = id => MAU_DAY.concat(MAU_THU).find(s => s.id === id);

/* ================== MÔ HÌNH AI (Naive Bayes) ================== */
function moHinh() {
  const n = { A: 0, B: 0 }, dem = { A: {}, B: {} };
  for (const t of day) { n[t.nhan]++; for (const f of DAC) { const k = f.k + ':' + t.s[f.k]; dem[t.nhan][k] = (dem[t.nhan][k] || 0) + 1; } }
  const w = {}, tamAnh = {};
  for (const f of DAC) {
    const ds = Object.keys(f.v); w[f.k] = {};
    for (const v of ds) {
      const k = f.k + ':' + v;
      const pa = ((dem.A[k] || 0) + 1) / (n.A + ds.length), pb = ((dem.B[k] || 0) + 1) / (n.B + ds.length);
      w[f.k][v] = Math.log(pa / pb);
    }
    const ws = Object.values(w[f.k]); tamAnh[f.k] = Math.max(...ws) - Math.min(...ws);
  }
  const tong = Object.values(tamAnh).reduce((a, b) => a + b, 0) || 1;
  const tiLe = {}; for (const f of DAC) tiLe[f.k] = tamAnh[f.k] / tong;
  return { n, dem, w, tiLe, tien: Math.log((n.A + 1) / (n.B + 1)) };
}
function duDoan(m, s) {
  let z = m.tien;
  const phan = DAC.map(f => ({ f, v: s[f.k], w: m.w[f.k][s[f.k]] }));
  for (const p of phan) z += p.w;
  const pA = 1 / (1 + Math.exp(-z));
  return { nhan: pA >= .5 ? 'A' : 'B', pA, tin: Math.max(pA, 1 - pA), phan: phan.slice().sort((a, b) => Math.abs(b.w) - Math.abs(a.w)) };
}
function mucDo(w) { const a = Math.abs(w); return a < .08 ? 'gần như không' : a < .5 ? 'nhẹ' : a < 1.1 ? 'vừa' : 'mạnh'; }
function giaiThich(d) {
  return d.phan.slice(0, 2).map(p => {
    const huong = p.w >= 0 ? 'A' : 'B';
    return `<li><b>${p.f.icon} ${p.f.ten}: ${p.f.v[p.v]}</b> → kéo <b>${mucDo(p.w)}</b> về <span style="color:${NHAN[huong].mau}" class="font-bold">${NHAN[huong].ten}</span></li>`;
  }).join('');
}
function canhBao(m) {
  const ds = [];
  if (day.length === 0) return ds;
  if (day.length < 6) ds.push({ loai: 'it', t: `AI mới học <b>${day.length}</b> mẫu – quá ít để đoán chính xác. Hãy dạy thêm!` });
  if (m.n.A === 0 || m.n.B === 0) ds.push({ loai: 'lech', t: `AI chưa thấy mẫu nào của nhãn <b>${m.n.A === 0 ? NHAN.A.ten : NHAN.B.ten}</b> → nó sẽ đoán mọi thứ về một phía!` });
  else if (Math.max(m.n.A, m.n.B) / Math.min(m.n.A, m.n.B) >= 2.5) ds.push({ loai: 'lech', t: `Dữ liệu <b>lệch nhãn</b>: ${m.n.A} mẫu “${NHAN.A.ten}” so với ${m.n.B} mẫu “${NHAN.B.ten}”.` });
  const top = DAC.slice().sort((a, b) => m.tiLe[b.k] - m.tiLe[a.k])[0];
  const nguong = Math.min(.6, 1.8 / DAC.length);
  if (day.length >= 4 && m.tiLe[top.k] >= nguong) ds.push({ loai: 'vet', f: top, t: `<b>AI đang bị học vẹt / thiên kiến dữ liệu!</b> Gần như chỉ nhìn vào <b>${top.icon} ${top.ten}</b> (${Math.round(m.tiLe[top.k] * 100)}% sức nặng quyết định), bỏ qua các dấu hiệu khác.` });
  return ds;
}

/* ================== TIỆN ÍCH ================== */
let tt;
function bao(html, ms = 2600) { const t = byId('toast'); t.innerHTML = html; t.classList.remove('an'); clearTimeout(tt); tt = setTimeout(() => t.classList.add('an'), ms); }
const ngu = ms => new Promise(r => setTimeout(r, ms));
let ac;
function tieng(f = 660, dai = .12, kieu = 'sine', to = .08) {
  if (!amThanh) return;
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const o = ac.createOscillator(), g = ac.createGain(); o.type = kieu; o.frequency.value = f; g.gain.value = to; g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + dai); o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + dai); } catch (e) {}
}
const tiengDung = () => { tieng(660, .12); setTimeout(() => tieng(990, .18), 110); };
const tiengSai = () => { tieng(220, .3, 'square', .05); };
function tron(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function theDac(s, nho) {

}
function huyHieu(nhan, lon) { const n = NHAN[nhan]; return `<span class="inline-flex items-center gap-1 rounded-full font-bold ${lon ? 'px-3 py-1' : 'px-2 py-0.5 text-sm'}" style="background:${n.nhat};color:${n.mau}">${n.icon} ${n.ten}</span>`; }

        <button onclick="moTab(1)" class="block mt-2 text-green-700 underline font-semibold">← Quay lại dạy thêm</button>
      </div>
      ${nutTiep(3, '🏭 Kiểm thử trên băng chuyền')}
    </aside>
  </div>`;
  veThu();
}
function veThu() {
  const s = { id: 'thu' }; document.querySelectorAll('[data-thu]').forEach(el => s[el.dataset.thu] = el.value);
  const d = duDoan(moHinh(), s);
  byId('thu-kq').innerHTML = `<div class="rounded-2xl p-3" style="background:${NHAN[d.nhan].nhat}">
    <div class="text-sm">AI đoán:</div><div class="text-lg font-extrabold" style="color:${NHAN[d.nhan].mau}">${NHAN[d.nhan].icon} ${NHAN[d.nhan].ten}</div>
    <div class="text-sm">Độ tự tin: <b>${Math.round(d.tin * 100)}%</b></div></div>`;
}
byId('b2').addEventListener('change', e => { if (e.target.dataset.thu) veThu(); });
function trongRong(tieuDe, loi, n) {
  return `<div class="bg-white rounded-3xl shadow-lg p-10 text-center"><div class="text-6xl mb-3">🤖💤</div><h2 class="text-2xl font-extrabold">${tieuDe}</h2>
    <p class="text-lg text-slate-600 mt-2 mb-5">${loi}</p>${nutTiep(n, n === 1 ? '🧑‍🏫 Đến Bước 1' : '🏭 Đến Bước 3')}</div>`;
}

/* ================== BƯỚC 3: BĂNG CHUYỀN ================== */
function veB3() {
  if (!day.length) { byId('b3').innerHTML = trongRong('AI chưa được huấn luyện!', 'Cổng AI chưa biết gì nên chưa thể kiểm thử. Hãy dạy AI ở Bước 1 trước.', 1); return; }
  const xong = kq.length, dung = kq.filter(k => k.du.nhan === k.s.dung).length;
  const V = CANH.vat;
  byId('b3').innerHTML = `
  <div class="bg-violet-50 border-2 border-violet-200 rounded-2xl px-4 py-3 mb-4 text-base">
    <b>Kiểm thử:</b> ${CHU.kiemThu} Phím tắt: <kbd>Space</kbd> = mẫu tiếp theo.
  </div>
  <div class="grid lg:grid-cols-[1fr_340px] gap-5">
    <div>
      <div id="canh" class="relative h-[300px] rounded-3xl overflow-hidden ${CANH.nenCanh} shadow-inner">
        <div class="absolute left-4 top-3 text-sm font-bold ${CANH.chuCanh}">${CHU.canh}</div>
        <div class="absolute right-4 top-3 text-sm font-bold ${CANH.chuCanh}">Mẫu: <span id="dem">${xong}</span>/${MAU_THU.length}</div>
        <div class="absolute inset-x-0 bottom-0 h-[44px] bg-slate-300"></div>
        <div id="bang" class="bang absolute inset-x-0 bottom-[44px] h-[26px] border-y-4 border-slate-700"></div>
        <div id="cong" class="absolute left-1/2 -translate-x-1/2 bottom-[70px] w-[${V.rong + 40}px] h-[215px]" style="width:${V.rong + 40}px">
          <div class="cong-vien absolute inset-0 border-[10px] border-b-0 border-indigo-500 rounded-t-[60px] transition-shadow"></div>
          <div class="absolute -top-1 left-1/2 -translate-x-1/2 bg-indigo-500 text-white text-sm font-extrabold px-3 py-1 rounded-full whitespace-nowrap shadow">🤖 CỔNG AI</div>
          <div class="laser absolute left-[10px] right-[10px] h-[4px] bg-rose-500 rounded-full" style="top:12%;box-shadow:0 0 12px 3px #f43f5e"></div>
        </div>
        <div id="vat" class="vat absolute bottom-[78px]" style="left:-${V.rong + 60}px"></div>
      </div>
      <div class="grid grid-cols-2 gap-4 mt-4">
        ${['A', 'B'].map(n => `<div class="rounded-3xl border-4 border-dashed p-3 min-h-[130px]" style="border-color:${NHAN[n].mau};background:${NHAN[n].nhat}">
          <div class="font-extrabold text-lg" style="color:${NHAN[n].mau}">${CHU.khay} ${NHAN[n].icon} ${NHAN[n].ten}</div>
          <div id="khay${n}" class="flex flex-wrap gap-2 mt-3">${kq.filter(k => k.du.nhan === n).map(k => oKhay(k)).join('')}</div></div>`).join('')}
      </div>
    </div>
    <aside class="flex flex-col gap-4">
      <div class="bg-white rounded-3xl shadow p-4">
        <div class="flex gap-2">
          <button id="chay-het" class="flex-1 rounded-2xl py-3 font-extrabold text-white bg-indigo-600 hover:bg-indigo-700 shadow">▶ Chạy tự động</button>
          <button id="chay-1" class="flex-1 rounded-2xl py-3 font-extrabold text-indigo-700 bg-indigo-100 hover:bg-indigo-200">⏭ Từng mẫu</button>
        </div>
        <button id="thu-lai" class="w-full mt-2 rounded-xl py-2 font-semibold bg-slate-100 hover:bg-slate-200 text-slate-600">${CHU.traLai}</button>
      </div>
      <div id="khung-du" class="bg-white rounded-3xl shadow p-4 min-h-[230px]">
        <div class="text-slate-400 text-center mt-10">Bấm <b>▶ Chạy tự động</b> để bắt đầu.</div>
      </div>
      <div class="bg-white rounded-3xl shadow p-4">
        <div class="flex justify-between font-bold"><span>🎯 Độ chính xác</span><span id="acc">${xong ? Math.round(dung / xong * 100) + '%' : '–'}</span></div>
        <div class="h-4 bg-slate-100 rounded-full mt-2 overflow-hidden"><div id="acc-thanh" class="thanh h-full rounded-full bg-gradient-to-r from-amber-400 to-green-600" style="width:${xong ? dung / xong * 100 : 0}%"></div></div>
        <div class="text-sm text-slate-500 mt-1" id="acc-ct">${xong ? `Đúng ${dung}/${xong} mẫu` : ''}</div>
      </div>
      <div id="nut-b4">${xong === MAU_THU.length ? nutTiep(4, '🔧 Đánh giá & dạy lại') : ''}</div>
    </aside>
  </div>`;
  byId('chay-het').onclick = () => chay(true);
  byId('chay-1').onclick = () => chay(false);
  byId('thu-lai').onclick = () => { if (dangChay) { dungLai = true; return; } kq = []; veB3(); };
}
function oKhay(k) {
  const ok = k.du.nhan === k.s.dung;
  return `<div class="nay relative bg-white rounded-xl p-1 w-[80px] text-center shadow-sm" title="${k.s.ten}"><div class="flex justify-center">${veMau(k.s, 48)}</div>
    <span class="absolute -top-2 -right-2 w-6 h-6 rounded-full grid place-items-center text-white text-sm font-bold ${ok ? 'bg-green-600' : 'bg-red-600'}">${ok ? '✓' : '✗'}</span>
    <div class="text-[10px] leading-tight truncate mt-0.5">${tenNgan(k.s)}</div></div>`;
}
async function chay(tuDong) {
  if (dangChay) { if (tuDong) dungLai = true; return; }
  if (kq.length >= MAU_THU.length) { kq = []; veB3(); }
  dangChay = true; dungLai = false;
  const m = moHinh(), V = CANH.vat;
  do {
    const s = MAU_THU[kq.length], vat = byId('vat'), bang = byId('bang');
    if (!vat) break;
    byId('chay-het').textContent = tuDong ? '⏸ Tạm dừng' : '▶ Chạy tự động';
    vat.style.transition = 'none'; vat.style.left = -(V.rong + 60) + 'px'; vat.style.transform = 'none'; vat.style.opacity = 1;
    vat.innerHTML = veMau(s, V.cao) + `<div class="text-center text-xs font-bold bg-white/85 rounded-full px-2 mt-1 mx-auto w-fit">${s.ten}</div>`;
    void vat.offsetWidth; vat.style.transition = '';
    bang.classList.add('chay'); tieng(300, .4, 'sawtooth', .02);
    vat.style.left = `calc(50% - ${V.rong / 2}px)`;
    await ngu(1150);
    bang.classList.remove('chay');
    byId('cong').classList.add('quet'); tieng(1200, .5, 'triangle', .03);
    byId('khung-du').innerHTML = `<div class="text-center mt-12 text-indigo-600 font-bold text-lg animate-pulse">🔴 AI đang quét “${s.ten}”…</div>`;
    await ngu(1900);
    byId('cong').classList.remove('quet');
    const d = duDoan(m, s), ok = d.nhan === s.dung;
    byId('khung-du').innerHTML = `
      <div class="the-dt">
        <div class="text-sm text-slate-500">AI dự đoán <b>${s.ten}</b> là:</div>
        <div class="text-2xl font-extrabold mt-1" style="color:${NHAN[d.nhan].mau}">${NHAN[d.nhan].icon} ${NHAN[d.nhan].ten}</div>
        <div class="flex justify-between text-sm font-semibold mt-3"><span>Độ tự tin</span><span>${Math.round(d.tin * 100)}%</span></div>
        <div class="h-3 bg-slate-100 rounded-full overflow-hidden"><div class="thanh h-full rounded-full" style="width:${d.tin * 100}%;background:${NHAN[d.nhan].mau}"></div></div>
        <div class="mt-3 font-bold text-sm">💡 Vì sao AI đoán như vậy?</div>
        <ul class="text-sm list-disc pl-5 mt-1 space-y-1">${giaiThich(d)}</ul>
        <div class="mt-3 rounded-xl px-3 py-2 font-bold ${ok ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
          ${ok ? `✓ ${CHU.chuyenGia}: ĐÚNG!` : `✗ ${CHU.chuyenGia}: SAI! Thật ra đây là “${NHAN[s.dung].ten}”.`}${s.batngo && !ok ? ' <span class="block font-semibold text-sm mt-1">⭐ Mẫu gây bất ngờ!</span>' : ''}</div>
      </div>`;
    ok ? tiengDung() : tiengSai();
    vat.classList.add(d.nhan === 'A' ? 'bay-A' : 'bay-B');
    await ngu(480);
    vat.classList.remove('bay-A', 'bay-B'); vat.style.opacity = 0;
    const k = { s, du: d }; kq.push(k);
    byId('khay' + d.nhan).insertAdjacentHTML('beforeend', oKhay(k));
    const dung = kq.filter(x => x.du.nhan === x.s.dung).length;
    byId('dem').textContent = kq.length;
    byId('acc').textContent = Math.round(dung / kq.length * 100) + '%';
    byId('acc-thanh').style.width = dung / kq.length * 100 + '%';
    byId('acc-ct').textContent = `Đúng ${dung}/${kq.length} mẫu`;
    if (kq.length === MAU_THU.length) {
      soLanThu++;
      const acc = Math.round(dung / kq.length * 100);
      lichSu.push({ ten: 'Kiểm thử lần ' + soLanThu, acc, n: day.length });
      byId('nut-b4').innerHTML = nutTiep(4, '🔧 Đánh giá & dạy lại');
      bao(`🏁 Xong! Độ chính xác của AI: <b>${acc}%</b>. ${acc < 80 ? 'Sang Bước 4 để sửa lỗi cho AI.' : 'Rất tốt! Xem chi tiết ở Bước 4.'}`, 4000);
      break;
    }
    if (tuDong) await ngu(1400);
  } while (tuDong && !dungLai);
  dangChay = false;
  const n = byId('chay-het'); if (n) n.textContent = kq.length && kq.length < MAU_THU.length ? '▶ Chạy tiếp' : '▶ Chạy tự động';
  const b = byId('bang'); if (b) b.classList.remove('chay');
}

/* ================== BƯỚC 4: ĐÁNH GIÁ & DẠY LẠI ================== */
let vuaSua = null;
function veB4() {
  if (!lichSu.length) { byId('b4').innerHTML = trongRong('Chưa có kết quả kiểm thử', 'Hãy cho các mẫu chạy qua băng chuyền ở Bước 3 trước.', 3); return; }
  const m = moHinh();
  const ds = MAU_THU.map(s => ({ s, d: duDoan(m, s) }));
  const dung = ds.filter(x => x.d.nhan === x.s.dung).length, acc = Math.round(dung / ds.length * 100);
  byId('b4').innerHTML = `
  <div class="bg-rose-50 border-2 border-rose-200 rounded-2xl px-4 py-3 mb-4 text-base">
    <b>Đánh giá:</b> Mẫu <span class="text-green-700 font-bold">xanh</span> = AI đoán đúng, mẫu <span class="text-red-700 font-bold">đỏ</span> = AI đoán sai.
    Bấm <b>“🔧 Sửa lỗi & Dạy lại”</b> ở mẫu sai để dạy AI đáp án đúng – trọng số bộ não AI được tính lại ngay và cả danh sách được chấm lại.
  </div>
  <div class="grid lg:grid-cols-[1fr_320px] gap-5">
    <div class="flex flex-col gap-3">${ds.map(({ s, d }) => {
      const ok = d.nhan === s.dung, moi = vuaSua && vuaSua.truoc[s.id] !== undefined && vuaSua.truoc[s.id] !== ok;
      return `<div class="${moi ? 'nay ring-4 ring-yellow-300' : ''} rounded-2xl border-2 p-3 flex flex-wrap sm:flex-nowrap gap-3 items-center ${ok ? 'border-green-300 bg-green-50' : 'border-red-300 bg-red-50'}">
        <div class="shrink-0 bg-white rounded-xl p-1">${veMau(s, 84)}</div>
        <div class="flex-1 min-w-[200px]">
          <div class="font-extrabold text-lg">${s.ten} ${s.batngo ? '<span class="text-xs bg-yellow-300 text-yellow-900 rounded-full px-2 py-0.5 align-middle">⭐ Mẫu gây bất ngờ</span>' : ''}</div>
          ${theDac(s, 1)}
          <div class="text-sm mt-1.5">AI đoán: ${huyHieu(d.nhan)} <span class="text-slate-500">(${Math.round(d.tin * 100)}% tự tin)</span> · Đáp án: ${huyHieu(s.dung)}</div>
          ${!ok || s.batngo ? `<div class="text-sm text-slate-600 mt-1">📝 ${s.gc}</div>` : ''}
        </div>
        <div class="shrink-0 text-center">${ok
          ? '<div class="text-green-700 font-extrabold text-lg">✓ Đúng</div>'
          : `<div class="text-red-700 font-extrabold text-lg mb-1">✗ Sai</div><button data-sua="${s.id}" class="rounded-xl px-3 py-2 font-bold text-white bg-red-600 hover:bg-red-700 shadow">🔧 Sửa lỗi & Dạy lại</button>`}</div>
      </div>`; }).join('')}
    </div>
    <aside class="flex flex-col gap-4">
      <div class="bg-white rounded-3xl shadow p-4 text-center">
        <div class="font-bold">🎯 Độ chính xác hiện tại</div>
        <div class="text-5xl font-extrabold mt-1 ${acc >= 80 ? 'text-green-600' : acc >= 60 ? 'text-amber-500' : 'text-red-600'}">${acc}%</div>
        <div class="text-sm text-slate-500">Đúng ${dung}/${ds.length} mẫu · AI đã học ${day.length} mẫu</div>
        ${acc === 100 ? '<div class="mt-2 text-green-700 font-bold">🏆 Tuyệt vời! AI đã phân loại đúng tất cả.</div>' : ''}
      </div>
      <div class="bg-white rounded-3xl shadow p-4">
        <div class="font-bold mb-2">📈 Sự tiến bộ của AI</div>
        <div class="flex items-end gap-2 h-40 border-b-2 border-slate-300 px-1">${lichSu.map((l, i) => `
          <div class="flex-1 flex flex-col items-center justify-end h-full" title="${l.ten}: ${l.acc}%">
            <span class="text-xs font-bold">${l.acc}%</span>
            <div class="thanh w-full rounded-t-lg ${i === lichSu.length - 1 ? 'bg-green-500' : 'bg-slate-300'}" style="height:${l.acc}%"></div></div>`).join('')}
        </div>
        <div class="flex gap-2 px-1 mt-1">${lichSu.map((l, i) => `<div class="flex-1 text-[10px] text-center text-slate-500 leading-tight">${i === 0 ? 'Lần đầu' : 'Sửa ' + i}</div>`).join('')}</div>
      </div>
      <div class="bg-amber-50 border-2 border-amber-200 rounded-3xl p-4 text-sm">
        <div class="font-bold text-base mb-1">💬 Bài học rút ra</div>
        <ul class="list-disc pl-5 space-y-1">${CHU.baiHoc.map(x => `<li>${x}</li>`).join('')}</ul>
      </div>
      <div class="flex flex-col gap-2">
        <button onclick="moTab(2)" class="rounded-2xl px-4 py-2.5 font-bold bg-sky-100 hover:bg-sky-200 text-sky-800">🧠 Xem trọng số mới</button>
        <button onclick="kq=[];moTab(3)" class="rounded-2xl px-4 py-2.5 font-bold bg-indigo-100 hover:bg-indigo-200 text-indigo-800">🏭 Chạy lại băng chuyền</button>
      </div>
    </aside>
  </div>`;
}
byId('b4').addEventListener('click', e => {
  const b = e.target.closest('[data-sua]'); if (!b) return;
  const s = tim(b.dataset.sua), m0 = moHinh(), truoc = {};
  MAU_THU.forEach(x => truoc[x.id] = duDoan(m0, x).nhan === x.dung);
  const acc0 = Math.round(Object.values(truoc).filter(Boolean).length / MAU_THU.length * 100);
  day.push({ s, nhan: s.dung, nguon: 'sua' });
  const m1 = moHinh(), ok1 = duDoan(m1, s).nhan === s.dung;
  const acc1 = Math.round(MAU_THU.filter(x => duDoan(m1, x).nhan === x.dung).length / MAU_THU.length * 100);
  lichSu.push({ ten: 'Sau khi sửa ' + s.ten, acc: acc1, n: day.length });
  vuaSua = { truoc };
  ok1 ? tiengDung() : tieng(520, .15);
  bao(`🔧 AI đã học thêm: <b>${s.ten}</b> = ${NHAN[s.dung].ten}. Độ chính xác: <b>${acc0}% → ${acc1}%</b>${ok1 ? '' : '<br>AI vẫn chưa đổi ý – dạy thêm lần nữa để tăng trọng số!'}`, 4200);
  veB4();
});

/* ================== PHÍM TẮT & KHỞI ĐỘNG ================== */
document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea')) return;
  if (tab === 1 && e.key === 'ArrowLeft') { e.preventDefault(); dayMau('A'); }
  else if (tab === 1 && e.key === 'ArrowRight') { e.preventDefault(); dayMau('B'); }
  else if (tab === 3 && e.key === ' ') { e.preventDefault(); chay(false); }
  else if (/^[1-4]$/.test(e.key) && !e.ctrlKey && !e.altKey) moTab(+e.key);
});
byId('nut-am').onclick = e => { amThanh = !amThanh; e.currentTarget.textContent = amThanh ? '🔊' : '🔇'; };
byId('nut-toan').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); };
document.title = CANH.ten;
byId('dau').className = 'text-white ' + CANH.mauDau;
byId('dau-icon').textContent = CANH.icon; byId('dau-ten').textContent = CANH.ten; byId('dau-mota').innerHTML = CANH.moTa;
document.documentElement.style.setProperty('--nen', CANH.nen);
document.documentElement.style.setProperty('--chinh', CANH.chinh);
moTab(1);
</script>
<script src="../chung/sw-dk.js?v=1"></script>
</body>
</html>
