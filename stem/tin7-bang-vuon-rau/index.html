    ["STT", "Loại rau", "Số hạt gieo", "Số hạt nảy mầm", "Tỉ lệ nảy mầm", "Chiều cao TB (cm)", "Chi phí (đồng)", "Ngày gieo"].forEach(function (t, c) { dat(1, c, t); });
    var tong = 0;
    DL.forEach(function (d, i) {
      var r = i + 2, n = r + 1;
      dat(r, 0, i + 1); dat(r, 1, d[0]); dat(r, 2, d[1]); dat(r, 3, d[2]);
      dat(r, 4, d[2] / d[1], "=D" + n + "/C" + n); dat(r, 5, d[3], "=AVERAGE(…)"); dat(r, 6, d[4]); dat(r, 7, d[5]);
      tong += d[4];
    });
    dat(7, 1, "Tổng chi phí"); dat(7, 6, tong, "=SUM(G3:G7)");
    var ten = function (r, c) { return COT[c] + (r + 1); };
    var f = function (r, c) { return W.f[r + "," + c] || {}; };
    var setF = function (r, c, k, v) { var o = W.f[r + "," + c] || (W.f[r + "," + c] = {}); if (v == null) delete o[k]; else o[k] = v; };

    function hienThi(r, c) {
      var o = O[r + "," + c]; if (!o) return "";
      var v = o.v, F = f(r, c);
      if (typeof v !== "number") return v;
      var dec = F.dec != null ? F.dec : 2;
      if (F.nf === "num") return so(v, dec, true);
      if (F.nf === "pct") return so(v * 100, dec, false) + "%";
      if (F.nf === "date") { var d = new Date(Date.UTC(1899, 11, 30) + v * 864e5); return pad(d.getUTCDate()) + "/" + pad(d.getUTCMonth() + 1) + "/" + d.getUTCFullYear(); }
      return Number.isInteger(v) ? String(v) : String(+v.toPrecision(10));
    }
    function pad(n) { return n < 10 ? "0" + n : "" + n; }
    function so(v, dec, tach) {
      var s = v.toFixed(dec), p = s.split(".");
      if (tach) p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      return p.join(".");
    }

    var neo = { r: 2, c: 4 }, dau = { r: 2, c: 4 }, hoat = { r: 2, c: 4 }, keo = false;
    function vung() { return { r1: Math.min(neo.r, dau.r), r2: Math.max(neo.r, dau.r), c1: Math.min(neo.c, dau.c), c2: Math.max(neo.c, dau.c) }; }
    function moiO(fn) { var v = vung(); for (var r = v.r1; r <= v.r2; r++) for (var c = v.c1; c <= v.c2; c++) fn(r, c); }
    function gopTai(r, c) { for (var i = 0; i < W.m.length; i++) { var g = W.m[i]; if (r >= g.r1 && r <= g.r2 && c >= g.c1 && c <= g.c2) return i; } return -1; }

    hop.innerHTML =
      '<div class="the"><h3>Bảng tính: VuonRau7A.xlsx</h3>' +
      '<div class="ribbon" role="toolbar" aria-label="Lệnh định dạng">' +
      '<div class="nhom-l"><button data-l="b" title="In đậm (Bold)">B</button><button data-l="al-l" title="Căn trái">⇤</button><button data-l="al-c" title="Căn giữa">≡</button><button data-l="al-r" title="Căn phải">⇥</button><button data-l="gop" title="Merge & Center: gộp ô và căn giữa">⊞ Merge &amp; Center</button></div>' +
      '<div class="nhom-l"><span class="goi-y" style="margin:0">Nền</span><button class="mau" data-nen="#bbf7d0" style="background:#bbf7d0" title="Tô nền xanh lá" aria-label="Tô nền xanh lá"></button><button class="mau" data-nen="#bfdbfe" style="background:#bfdbfe" title="Tô nền xanh dương" aria-label="Tô nền xanh dương"></button><button class="mau" data-nen="#fde68a" style="background:#fde68a" title="Tô nền vàng" aria-label="Tô nền vàng"></button><button class="mau" data-nen="#fdba74" style="background:#fdba74" title="Tô nền cam" aria-label="Tô nền cam"></button><button class="mau" data-nen="#475569" style="background:#475569" title="Tô nền xám đậm" aria-label="Tô nền xám đậm"></button><button class="mau" data-nen="" style="background:#fff" title="Không tô nền" aria-label="Không tô nền">∅</button></div>' +
      '<div class="nhom-l"><button data-l="vien" title="All Borders: kẻ viền mọi ô">▦ Viền</button><button data-l="bo-vien" title="No Border: bỏ viền">□ Bỏ viền</button></div>' +
      '<div class="nhom-l"><select id="kieu-so" aria-label="Kiểu dữ liệu số"><option value="">General</option><option value="num">Number</option><option value="pct">Percentage</option><option value="date">Date</option></select><button data-l="dec+" title="Increase Decimal: thêm chữ số thập phân">.0→.00</button><button data-l="dec-" title="Decrease Decimal: bớt chữ số thập phân">.00→.0</button></div>' +
      "</div>" +
      '<div class="thanh-ct"><input id="hop-ten" aria-label="Ô hoặc vùng đang chọn" value="E3"><span class="fx">fx</span><span class="gt-ct" id="gt-ct"></span></div>' +
      '<div class="bang-cuon"><table class="ss" id="ss"></table></div>' +
      '<div class="ghi-chu-in"><label><input type="checkbox" id="an-luoi"> Ẩn đường lưới (xem như khi in ra giấy)</label><label><input type="checkbox" id="den-trang"> Xem bản in đen trắng</label><button class="btn nho" id="lam-lai">↺ Trả về bảng thô</button></div>' +
      '<p class="goi-y">Chọn ô: bấm chuột, kéo chuột hoặc Shift + bấm để chọn vùng; bấm chữ cột/số hàng để chọn cả cột/hàng; hoặc gõ địa chỉ như <b>A2:H2</b> vào ô bên trái rồi Enter.</p></div>';

    var bang = hop.querySelector("#ss");
    function ve() {
      var v = vung(), h = '<tr><th class="rh"></th>' + COT.map(function (L, c) { return '<th data-cot="' + c + '" class="' + (c >= v.c1 && c <= v.c2 ? "sel" : "") + '">' + L + "</th>"; }).join("") + "</tr>";
      for (var r = 0; r < NH; r++) {
        h += '<tr><th class="rh' + (r >= v.r1 && r <= v.r2 ? " sel" : "") + '" data-hang="' + r + '">' + (r + 1) + "</th>";
        for (var c = 0; c < NC; c++) {
          var gi = gopTai(r, c), span = "";
          if (gi >= 0) { var g = W.m[gi]; if (r !== g.r1 || c !== g.c1) continue; span = ' colspan="' + (g.c2 - g.c1 + 1) + '" rowspan="' + (g.r2 - g.r1 + 1) + '"'; }
          var F = f(r, c), o = O[r + "," + c], so_ = o && typeof o.v === "number";
          var al = F.al || (gi >= 0 ? "c" : (so_ ? "r" : "l"));
          var st = "text-align:" + { l: "left", c: "center", r: "right" }[al] + ";" + (F.nen ? "background:" + F.nen + ";" : "");
          var cls = (F.b ? "vg " : "") + (F.bd ? "bd " : "") + (r >= v.r1 && r <= v.r2 && c >= v.c1 && c <= v.c2 ? "in " : "") + (r === hoat.r && c === hoat.c ? "hoat" : "");
          h += '<td data-r="' + r + '" data-c="' + c + '"' + span + ' class="' + cls + '" style="' + st + '">' + hienThi(r, c) + "</td>";
        }
        h += "</tr>";
      }
      bang.innerHTML = h;
      hop.querySelector("#hop-ten").value = ten(v.r1, v.c1) + (v.r1 !== v.r2 || v.c1 !== v.c2 ? ":" + ten(v.r2, v.c2) : "");
      var o = O[hoat.r + "," + hoat.c];
      hop.querySelector("#gt-ct").textContent = o ? (o.ct || String(o.v)) : "";
      hop.querySelector("#kieu-so").value = f(hoat.r, hoat.c).nf || "";
    }

    function kiemTra() {
      var tat = function (r1, r2, c1, c2, fn) { for (var r = r1; r <= r2; r++) for (var c = c1; c <= c2; c++) if (!fn(f(r, c), r, c)) return false; return true; };
      var g0 = W.m.some(function (g) { return g.r1 === 0 && g.r2 === 0 && g.c1 === 0 && g.c2 === 7; });
      api.dat("td", g0 && !!f(0, 0).b && (f(0, 0).al || "c") === "c");
      api.dat("dc", tat(1, 1, 0, 7, function (F) { return F.b && F.nen && F.al === "c"; }));
      api.dat("pt", tat(2, 6, 4, 4, function (F) { return F.nf === "pct" && (F.dec != null ? F.dec : 2) <= 1; }));
      api.dat("cc", tat(2, 6, 5, 5, function (F) { return F.nf === "num" && F.dec === 1; }));
      api.dat("tien", tat(2, 7, 6, 6, function (F) { return F.nf === "num" && F.dec === 0; }));
      api.dat("ngay", tat(2, 6, 7, 7, function (F) { return F.nf === "date"; }));
      api.dat("vien", tat(1, 7, 0, 7, function (F) { return F.bd; }));
      // ô tỉ lệ nảy mầm cao nhất có màu nền riêng
      var rMax = 2; for (var r = 3; r <= 6; r++) if (O[r + ",4"].v > O[rMax + ",4"].v) rMax = r;
      var nenMax = f(rMax, 4).nen, rieng = !!nenMax && nenMax !== f(1, 4).nen;
      for (var r2 = 2; r2 <= 6; r2++) if (r2 !== rMax && f(r2, 4).nen === nenMax) rieng = false;
      api.dat("nb", rieng);
      api.luu();
    }

    function chonVung(a, b, h) { neo = a; dau = b; hoat = h || a; ve(); }
    bang.addEventListener("pointerdown", function (e) {
      var td = e.target.closest("td[data-r]"), th = e.target.closest("th");
      if (td) {
        var r = +td.dataset.r, c = +td.dataset.c, gi = gopTai(r, c);
        if (e.shiftKey) { dau = { r: r, c: c }; ve(); return; }
        keo = e.pointerType === "mouse";
        if (gi >= 0) { var g = W.m[gi]; chonVung({ r: g.r1, c: g.c1 }, { r: g.r2, c: g.c2 }); return; }
        chonVung({ r: r, c: c }, { r: r, c: c }); return;
      }
      if (th && th.dataset.cot != null) { var cc = +th.dataset.cot; chonVung({ r: 0, c: cc }, { r: NH - 1, c: cc }); }
      if (th && th.dataset.hang != null) { var rr = +th.dataset.hang; chonVung({ r: rr, c: 0 }, { r: rr, c: NC - 1 }); }
    });
    bang.addEventListener("pointerover", function (e) {
      if (!keo) return; var td = e.target.closest("td[data-r]"); if (!td) return;
      var r = +td.dataset.r, c = +td.dataset.c;
      if (r !== dau.r || c !== dau.c) { dau = { r: r, c: c }; ve(); }
    });
    document.addEventListener("pointerup", function () { keo = false; });

    hop.querySelector("#hop-ten").addEventListener("keydown", function (e) {
      if (e.key !== "Enter") return;
      var m = this.value.trim().toUpperCase().match(/^([A-H])([1-8])(?::([A-H])([1-8]))?$/);
      if (!m) { api.bao("Địa chỉ không hợp lệ. Ví dụ: A2:H2"); return; }
      neo = { r: +m[2] - 1, c: COT.indexOf(m[1]) };
      dau = m[3] ? { r: +m[4] - 1, c: COT.indexOf(m[3]) } : { r: neo.r, c: neo.c };
      hoat = neo; ve();
    });

    function xong() { api.luu(); ve(); kiemTra(); }
    hop.querySelector(".ribbon").addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b) return;
      if (b.dataset.nen != null) { moiO(function (r, c) { setF(r, c, "nen", b.dataset.nen || null); }); xong(); return; }
      var l = b.dataset.l;
      if (l === "b") { var bat = !f(hoat.r, hoat.c).b; moiO(function (r, c) { setF(r, c, "b", bat || null); }); }
      else if (l && l.indexOf("al-") === 0) moiO(function (r, c) { setF(r, c, "al", l.slice(3)); });
      else if (l === "vien") moiO(function (r, c) { setF(r, c, "bd", true); });
      else if (l === "bo-vien") moiO(function (r, c) { setF(r, c, "bd", null); });
      else if (l === "dec+" || l === "dec-") {
        moiO(function (r, c) { var F = f(r, c); if (!F.nf) setF(r, c, "nf", "num"); var d = F.dec != null ? F.dec : 2; setF(r, c, "dec", Math.max(0, Math.min(6, d + (l === "dec+" ? 1 : -1)))); });
      } else if (l === "gop") {
        var v = vung(), gi = gopTai(v.r1, v.c1);
        if (gi >= 0 && W.m[gi].r1 === v.r1 && W.m[gi].c1 === v.c1 && W.m[gi].r2 === v.r2 && W.m[gi].c2 === v.c2) { W.m.splice(gi, 1); api.bao("Đã bỏ gộp ô."); }
        else if (v.r1 === v.r2 && v.c1 === v.c2) { api.bao("Hãy chọn từ hai ô trở lên để gộp."); return; }
        else {
          var coDL = false;
          moiO(function (r, c) { if ((r !== v.r1 || c !== v.c1) && O[r + "," + c]) coDL = true; });
          if (coDL) { api.bao("Vùng này có nhiều ô chứa dữ liệu: gộp sẽ mất dữ liệu. Chỉ gộp vùng chỉ có ô đầu tiên chứa dữ liệu."); return; }
          W.m = W.m.filter(function (g) { return g.r2 < v.r1 || g.r1 > v.r2 || g.c2 < v.c1 || g.c1 > v.c2; });
          W.m.push(v); setF(v.r1, v.c1, "al", "c");
        }
      } else return;
      xong();
    });
    hop.querySelector("#kieu-so").addEventListener("change", function () {
      var nf = this.value;
      moiO(function (r, c) { setF(r, c, "nf", nf || null); if (nf === "date" || !nf) setF(r, c, "dec", null); else if (nf === "pct") setF(r, c, "dec", 0); });
      xong();
    });
    hop.querySelector("#an-luoi").addEventListener("change", function () { bang.classList.toggle("an-luoi", this.checked); });
    hop.querySelector("#den-trang").addEventListener("change", function () { bang.classList.toggle("den-trang", this.checked); });
    hop.querySelector("#lam-lai").addEventListener("click", function () {
      if (!confirm("Xoá mọi định dạng, trả bảng về dạng thô ban đầu?")) return;
      for (var k in W.f) delete W.f[k]; W.m.length = 0; xong();
    });
    ve(); kiemTra();

    return {
      cham: function (c) {
        var so4 = ["pt", "cc", "tien", "ngay"].filter(c.tc).length, tb = ["td", "dc", "vien", "nb"].filter(c.tc).length;
        var dam = Object.keys(W.f).filter(function (k) { return W.f[k].nen === "#475569"; }).length;
        var r1 = { m: so4 === 4 ? 3 : so4 >= 2 ? 2 : 1, ly: "Định dạng đúng " + so4 + "/4 cột số (phần trăm, số thập phân, tiền, ngày)." };
        var r2 = { m: tb === 4 && !dam ? 3 : tb >= 2 ? 2 : 1, ly: "Đạt " + tb + "/4 yêu cầu trình bày (gộp ô tiêu đề, tên cột nổi bật, kẻ viền, làm nổi bật số liệu)" + (dam ? "; có " + dam + " ô nền xám đậm, in đen trắng sẽ khó đọc" : "") + "." };
        var dx = c.tl("b5-1"), coSo = /\d/.test(dx), nt = c.tieng("b5-1");
        var r4 = { m: coSo && nt >= 12 ? 3 : nt >= 6 ? 2 : 1, ly: coSo && nt >= 12 ? "Đề xuất có dẫn số liệu cụ thể trong bảng." : nt >= 6 ? "Có đề xuất nhưng chưa dẫn số liệu cụ thể (con số) trong bảng." : "Chưa có đề xuất với Ban giám hiệu." };
        if (dam) c.goi(3, "Có " + dam + " ô tô nền <b>xám đậm</b>: in đen trắng chữ sẽ bị che. Bật “Xem bản in đen trắng” để thử rồi đổi sang màu nhạt.");
        if (nt >= 3 && !coSo) c.goi(4, "Câu 2 Bước 5: dẫn số liệu cụ thể trong bảng (tỉ lệ nảy mầm, chiều cao…) để đề xuất thuyết phục hơn.", "tl:b5-1");
        return {
          rub: [r1, r2, c.thietKe(), r4, c.hopTac()],
          cach: {
            td: "Chọn A1:H1, bấm <b>Merge &amp; Center</b>, rồi bấm In đậm.",
            dc: "Chọn A2:H2: bấm In đậm, Căn giữa và tô một màu nền nhạt.",
            pt: "Chọn E3:E7, chọn kiểu <b>Percentage</b>, bấm .00→.0 cho còn tối đa 1 chữ số thập phân.",
            cc: "Chọn F3:F7, chọn kiểu <b>Number</b>, chỉnh còn đúng 1 chữ số thập phân.",
            tien: "Chọn G3:G8, chọn kiểu <b>Number</b>, bấm .00→.0 đến khi không còn phần thập phân.",
            ngay: "Chọn H3:H7, chọn kiểu <b>Date</b>.",
            vien: "Chọn A2:H8, bấm <b>All Borders</b>.",
            nb: "Đọc kĩ cột Tỉ lệ nảy mầm (hai loại rau rất sát nhau), tô một màu nền riêng chỉ cho ô cao nhất, khác màu dòng tên cột."
          }
        };
      },
      baoCao: function () {
        var h = '<table style="font-size:11pt">';
        for (var r = 0; r < NH; r++) {
          h += "<tr>";
          for (var c = 0; c < NC; c++) {
            var gi = gopTai(r, c), span = "";
            if (gi >= 0) { var g = W.m[gi]; if (r !== g.r1 || c !== g.c1) continue; span = ' colspan="' + (g.c2 - g.c1 + 1) + '"'; }
            var F = f(r, c), o = O[r + "," + c], so_ = o && typeof o.v === "number";
            var al = F.al || (gi >= 0 ? "c" : (so_ ? "r" : "l"));
            h += "<td" + span + ' style="text-align:' + { l: "left", c: "center", r: "right" }[al] + ";" + (F.b ? "font-weight:700;" : "") + (F.nen ? "background:" + F.nen + ";" : "") + (F.bd ? "" : "border-color:#eee;") + '">' + hienThi(r, c) + "</td>";
          }
          h += "</tr>";
        }
        return h + "</table>";
      }
    };
  }
};
