<style>
.mau-ds { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.mau-the { border: 2px solid var(--vien); border-radius: 12px; padding: 6px; background: #fff; text-align: left; }
.mau-the.chon { border-color: var(--chinh); box-shadow: 0 0 0 3px var(--chinh-nhat); }

.mau-the span.goi-y { display: block; margin: 0 2px 2px; font-size: 12px; }
.soan { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 12px; }
@media (max-width: 720px) { .soan { grid-template-columns: 1fr; } .ds-trang { flex-direction: row !important; overflow-x: auto; max-height: none !important; } .ds-trang .nho-tr { flex: 0 0 120px; } }
.ds-trang { display: flex; flex-direction: column; gap: 8px; max-height: 520px; overflow-y: auto; padding: 2px; }
.nho-tr { border: 2px solid transparent; border-radius: 8px; padding: 0; background: none; text-align: left; position: relative; }
.nho-tr.chon { border-color: var(--chinh); }
.nho-tr .so-tr { position: absolute; left: -2px; top: -2px; background: #0f172a; color: #fff; font-size: 11px; border-radius: 6px 0 6px 0; padding: 0 5px; z-index: 2; }
.thanh-tr { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.form-tr { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; margin-top: 10px; }
.form-tr label { font-size: 13px; font-weight: 700; color: var(--nhat); display: block; }
.form-tr input, .form-tr select, .form-tr textarea { width: 100%; border: 1px solid var(--vien); border-radius: 8px; padding: 6px 9px; background: #fff; }
.form-tr textarea { min-height: 96px; resize: vertical; }
.form-tr .rong { grid-column: 1 / -1; }
@media (max-width: 560px) { .form-tr { grid-template-columns: 1fr; } }
.canh-bao { font-size: 13px; color: var(--loi); }

/* trang chiếu */
.tc { container-type: inline-size; aspect-ratio: 16 / 9; width: 100%; border-radius: 6px; overflow: hidden; position: relative; box-shadow: 0 1px 4px rgba(0,0,0,.18); }
.tc .nen { position: absolute; inset: 0; }
.tc .nd { position: absolute; inset: 7% 6% 7% 6%; display: flex; flex-direction: column; }
.tc h2 { margin: 0 0 3cqw; font-size: 5.2cqw; line-height: 1.15; }
.tc ul { margin: 0; padding-left: 4.5cqw; font-size: 3cqw; line-height: 1.45; }
.tc .ph { opacity: .45; font-style: italic; }
.tc .than { display: flex; gap: 4cqw; flex: 1; min-height: 0; }
.tc .than > * { flex: 1; min-width: 0; }
.tc .anh { display: grid; place-items: center; font-size: 13cqw; border-radius: 2cqw; }
.tc.lo-tieu-de .nd, .tc.lo-ket .nd { justify-content: center; align-items: center; text-align: center; }
.tc.lo-tieu-de h2, .tc.lo-ket h2 { font-size: 7.4cqw; }
.tc .phu { font-size: 3.4cqw; margin-top: 1cqw; }
.tc.lo-anh .anh { font-size: 22cqw; }
.tc .chu-thich { text-align: center; font-size: 2.8cqw; margin-top: 1.5cqw; }
.chieu { position: fixed; inset: 0; background: #000; z-index: 200; display: grid; place-items: center; }
.chieu .tc { width: min(100vw, 177.7vh); border-radius: 0; box-shadow: none; }
.chieu .thoat { position: absolute; top: 10px; right: 10px; z-index: 3; }
.chieu .dem { position: absolute; bottom: 10px; right: 14px; color: #fff8; font-size: 14px; }
</style>

      else if (s.lo === "anh") than = '<div class="than" style="flex-direction:column;gap:0">' + (hinh || '<div class="anh ph" style="background:' + M.nhan + '">🖼️</div>') + '<div class="chu-thich">' + (s.nd ? esc(dong(s.nd).join(" · ")) : '<span class="ph">' + esc(ph[1] || "Chú thích") + "</span>") + "</div></div>";
      return '<div class="tc lo-' + s.lo + '" style="font-family:' + M.font + ";color:" + (dau_ ? M.chuDau : M.chu) + '">' +
        '<div class="nen" style="background:' + (dau_ ? M.nenDau : M.trangTri + "," + M.nen) + '"></div>' +
        '<div class="nd"><h2 style="color:' + (dau_ ? M.chuDau : M.tieu) + '">' + tieu + "</h2>" + than + "</div></div>";
    }

    hop.innerHTML =
      '<div class="the"><h3>① Chọn bản mẫu</h3><div class="mau-ds" id="mau-ds"></div>' +
      '<p class="goi-y" id="mau-gy">Đổi bản mẫu bất cứ lúc nào: mọi trang đổi theo cùng lúc.</p></div>' +
      '<div class="the"><h3>② Soạn trang chiếu</h3><div class="thanh-tr">' +
      '<button class="btn nho" id="tao-gy">✨ Tạo bài từ gợi ý của bản mẫu</button><button class="btn nho" id="them">＋ Trang mới</button><button class="btn nho" id="nhan">⧉ Nhân đôi</button><button class="btn nho" id="len">↑</button><button class="btn nho" id="xuong-tr">↓</button><button class="btn nho" id="xoa">🗑 Xoá trang</button><button class="btn nho chinh" id="chieu">▶ Trình chiếu</button></div>' +
      '<div class="soan"><div class="ds-trang" id="ds"></div><div><div id="lon"></div><div class="form-tr" id="form"></div></div></div></div>';
    var $ = function (s) { return hop.querySelector(s); };

    function veMau() {
      $("#mau-ds").innerHTML = MAU.map(function (m) {
        var mo = { lo: "tieu-de", t: "Bình lọc nước", nd: "Nhóm 1 – 8A" };
        var keep = W.mau; W.mau = m.id; var h = veTrang(mo); W.mau = keep;
        return '<button class="mau-the' + (W.mau === m.id ? " chon" : "") + '" data-mau="' + m.id + '">' + h + "<b>" + m.ten + '</b><span class="goi-y">' + m.mo + "</span></button>";
      }).join("");
    }
    function veDs() {
      var ds = $("#ds");
      if (!W.ds.length) { ds.innerHTML = '<p class="goi-y">Chưa có trang nào.</p>'; }
      else ds.innerHTML = W.ds.map(function (s, i) { return '<button class="nho-tr' + (i === W.chon ? " chon" : "") + '" data-tr="' + i + '" aria-label="Trang ' + (i + 1) + '"><span class="so-tr">' + (i + 1) + "</span>" + veTrang(s) + "</button>"; }).join("");
    }
    function veLon() {
      var s = W.ds[W.chon];
      if (!s) { $("#lon").innerHTML = '<div class="tc" style="display:grid;place-items:center;background:#f1f5f9;color:#64748b;font-size:15px;text-align:center;padding:10px">' + (W.mau ? "Bấm “✨ Tạo bài từ gợi ý của bản mẫu” hoặc “＋ Trang mới”." : "Hãy chọn một bản mẫu ở trên trước.") + "</div>"; $("#form").innerHTML = ""; return; }
      $("#lon").innerHTML = veTrang(s);
      var ph = s.ph || [];
      var f = '<div><label for="f-lo">Bố cục (Layout)</label><select id="f-lo" data-f="lo">' + Object.keys(BO_CUC).map(function (k) { return '<option value="' + k + '"' + (s.lo === k ? " selected" : "") + ">" + BO_CUC[k] + "</option>"; }).join("") + "</select></div>" +
        '<div><label for="f-h">Hình minh hoạ</label><select id="f-h" data-f="h">' + Object.keys(HINH).map(function (k) { return '<option value="' + k + '"' + ((s.h || "") === k ? " selected" : "") + ">" + (k ? k + " " : "") + HINH[k] + "</option>"; }).join("") + "</select></div>" +
        '<div class="rong"><label for="f-t">Tiêu đề</label><input id="f-t" data-f="t" placeholder="' + esc(ph[0] || "") + '"></div>' +
        '<div class="' + (s.lo === "hai-cot" ? "" : "rong") + '"><label for="f-nd">' + (s.lo === "tieu-de" || s.lo === "ket" ? "Phụ đề" : s.lo === "anh" ? "Chú thích" : s.lo === "hai-cot" ? "Cột trái (mỗi ý một dòng)" : "Nội dung (mỗi ý một dòng)") + '</label><textarea id="f-nd" data-f="nd" placeholder="' + esc(ph[1] || "") + '"></textarea></div>' +
        (s.lo === "hai-cot" ? '<div><label for="f-nd2">Cột phải (mỗi ý một dòng)</label><textarea id="f-nd2" data-f="nd2" placeholder="' + esc(ph[2] || "") + '"></textarea></div>' : "") +
        '<div class="rong canh-bao" id="cb"></div>';
      $("#form").innerHTML = f;
      $("#f-t").value = s.t || ""; $("#f-nd").value = s.nd || ""; if ($("#f-nd2")) $("#f-nd2").value = s.nd2 || "";
      canhBao();
    }
    function loiGon(s) {
      var d = dong(s.nd).concat(dong(s.nd2)), loi = [];
      if (s.lo !== "tieu-de" && s.lo !== "ket" && s.lo !== "anh" && d.length > 6) loi.push("quá 6 dòng (" + d.length + ")");
      d.forEach(function (x, i) { var n = x.split(/\s+/).length; if (n > 12) loi.push("dòng “" + x.slice(0, 24) + "…” có " + n + " tiếng"); });
      return loi;
    }
    function canhBao() { var s = W.ds[W.chon], cb = $("#cb"); if (!s || !cb) return; var l = loiGon(s); cb.textContent = l.length ? "⚠ Trang này chưa ngắn gọn: " + l.join("; ") + "." : ""; }

    function kiemTra() {
      var ds = W.ds;
      api.dat("bm", !!W.mau && ds.length > 0);
      api.dat("du", ds.length >= 6 && ds.every(function (s) { return (s.t || "").trim(); }));
      api.dat("dau", !!ds[0] && ds[0].lo === "tieu-de" && !!(ds[0].t || "").trim() && /nhóm/i.test(ds[0].nd || ""));
      api.dat("gon", ds.length > 0 && ds.every(function (s) { return !loiGon(s).length; }));
      api.dat("hinh", ds.filter(function (s) { return s.h; }).length >= 3);
      api.dat("ket", ds.length > 1 && ds[ds.length - 1].lo === "ket" && !!(ds[ds.length - 1].t || "").trim());
      api.luu();
    }
    function veHet() { veMau(); veDs(); veLon(); kiemTra(); }

    hop.addEventListener("click", function (e) {
      var m = e.target.closest("[data-mau]");
      if (m) { W.mau = m.dataset.mau; api.luu(); veHet(); api.bao("Đã áp dụng bản mẫu “" + mau().ten + "” cho mọi trang."); return; }
      var t = e.target.closest("[data-tr]");
      if (t) { W.chon = +t.dataset.tr; api.luu(); veDs(); veLon(); return; }
      var id = e.target.closest("button") && e.target.closest("button").id;
      if (!id) return;
      if (id !== "chieu" && !W.mau) { api.bao("Hãy chọn bản mẫu trước."); return; }
      if (id === "tao-gy") {
        if (W.ds.length && !confirm("Thay toàn bộ trang hiện có bằng các trang gợi ý của bản mẫu?")) return;
        W.ds = GOI_Y.map(function (g) { return { lo: g.lo, ph: g.p.slice(), t: "", nd: "", nd2: "", h: "" }; }); W.chon = 0;
      } else if (id === "them") { W.ds.splice(W.chon + 1, 0, { lo: "noi-dung", t: "", nd: "", nd2: "", h: "" }); W.chon = Math.min(W.chon + 1, W.ds.length - 1); }
      else if (id === "nhan" && W.ds[W.chon]) { W.ds.splice(W.chon + 1, 0, JSON.parse(JSON.stringify(W.ds[W.chon]))); W.chon++; }
      else if (id === "len" && W.chon > 0) { var a = W.ds.splice(W.chon, 1)[0]; W.ds.splice(--W.chon, 0, a); }
      else if (id === "xuong-tr" && W.chon < W.ds.length - 1) { var b = W.ds.splice(W.chon, 1)[0]; W.ds.splice(++W.chon, 0, b); }
      else if (id === "xoa" && W.ds[W.chon]) { if (!confirm("Xoá trang " + (W.chon + 1) + "?")) return; W.ds.splice(W.chon, 1); W.chon = Math.max(0, Math.min(W.chon, W.ds.length - 1)); }
      else if (id === "chieu") { trinhChieu(); return; }
      else return;
      api.luu(); veHet();
    });
    hop.addEventListener("input", function (e) {
      var k = e.target.dataset && e.target.dataset.f; if (!k) return;
      var s = W.ds[W.chon]; if (!s) return;
      s[k] = e.target.value;
      if (k === "lo") { veLon(); }
      else { $("#lon").innerHTML = veTrang(s); canhBao(); }
      var nho = hop.querySelector('[data-tr="' + W.chon + '"]'); if (nho) nho.innerHTML = '<span class="so-tr">' + (W.chon + 1) + "</span>" + veTrang(s);
      kiemTra();
    });

    function trinhChieu() {
      if (!W.ds.length) { api.bao("Chưa có trang chiếu nào."); return; }
      var i = 0, o = document.createElement("div");
      o.className = "chieu"; o.tabIndex = -1;
      function ve() { o.innerHTML = '<button class="btn nho thoat">✕ Thoát (Esc)</button>' + veTrang(W.ds[i]) + '<span class="dem">' + (i + 1) + " / " + W.ds.length + "</span>"; }
      function thoat() { document.removeEventListener("keydown", phim); o.remove(); if (document.fullscreenElement) document.exitFullscreen().catch(function () {}); }
      function phim(e) {
        if (e.key === "Escape") thoat();
        else if (["ArrowRight", "PageDown", " ", "Enter"].indexOf(e.key) >= 0) { e.preventDefault(); if (i < W.ds.length - 1) { i++; ve(); } else thoat(); }
        else if (["ArrowLeft", "PageUp"].indexOf(e.key) >= 0) { e.preventDefault(); if (i > 0) { i--; ve(); } }
      }
      o.addEventListener("click", function (e) { if (e.target.closest(".thoat")) { thoat(); return; } if (i < W.ds.length - 1) { i++; ve(); } else thoat(); });
      document.addEventListener("keydown", phim);
      ve(); document.body.appendChild(o); o.focus();
      if (o.requestFullscreen) o.requestFullscreen().catch(function () {});
    }

    veHet();
    return {
      baoCao: function () {
        var M = mau();
        return "<p><b>Bản mẫu:</b> " + (M ? M.ten : "(chưa chọn)") + " · <b>Số trang:</b> " + W.ds.length + "</p><ol>" +
          W.ds.map(function (s) {
            var nd = dong(s.nd).concat(dong(s.nd2));
            return "<li><b>" + esc(s.t || "(chưa có tiêu đề)") + "</b> <i>(" + BO_CUC[s.lo] + (s.h ? ", hình " + s.h : "") + ")</i>" + (nd.length ? "<br>" + nd.map(esc).join("; ") : "") + "</li>";
          }).join("") + "</ol>";
      }
    };
  }
};
</script>

<script src="../../chung/api.js?v=29"></script>
<script src="../../chung/tuc-thi.js?v=2"></script>
