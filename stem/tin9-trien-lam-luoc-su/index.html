    luuY: "Thứ tự đúng và khoảng cách: Pascaline 1642 → Máy phân tích 1833 (191 năm) → ENIAC 1945 (112) → IBM 7090 1959 (14) → IBM System/360 1964 (5) → Micral 1973 (9) → iPhone 2007 (34); cả chặng 365 năm. Bảng khoảng cách chỉ mở khi dòng thời gian đã đúng hết. Nhận xét mong đợi: hai mốc đầu cách nhau hàng trăm năm, từ thời máy tính điện tử các mốc chỉ cách nhau vài năm đến vài chục năm."
  },

  xuong: function (hop, api) {
    var W = api.w;
    var MOC = [
      { n: 1642, t: "Pascaline", m: "Máy tính cơ học của Blaise Pascal, làm phép cộng, trừ." },
      { n: 1833, t: "Máy phân tích", m: "Charles Babbage thiết kế, có ý tưởng bộ nhớ và chương trình." },
      { n: 1945, t: "ENIAC", m: "Máy tính điện tử dùng đèn điện tử chân không, nặng khoảng 27 tấn." },
      { n: 1959, t: "IBM 7090", m: "Dùng bóng bán dẫn thay đèn điện tử." },
      { n: 1964, t: "IBM System/360", m: "Dùng mạch tích hợp (IC)." },
      { n: 1973, t: "Micral", m: "Một trong những máy tính cá nhân đầu tiên dùng bộ vi xử lí." },

    var TEP = [
      ["tep", "Pascaline.png"], ["tep", "CharlesBabbage.docx"], ["tep", "ENIAC.jpg"], ["tep", "IBM7090.png"], ["tep", "Micral.jpg"], ["tep", "iPhone.png"], ["tep", "MocThoiGian.xlsx"],
      ["link", "Video: Charles Babbage và máy phân tích (YouTube)"], ["link", "Bảo tàng Lịch sử Máy tính (computerhistory.org)"]
    ];
    if (!W.tg) { W.tg = [3, 0, 5, 1, 6, 2, 4]; }
    if (!W.mm) W.mm = { ten: "Lược sử công cụ tính toán", nhanh: [] };
    if (!W.kc) W.kc = {};
    var moDk = null; // đường dẫn nút đang mở hộp đính kèm
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

    hop.innerHTML =
      '<div class="the"><h3>① Dòng thời gian</h3><p class="goi-y" style="margin-top:0">Dùng ↑ ↓ sắp xếp các mốc từ cũ nhất đến mới nhất, rồi bấm Kiểm tra. Năm sẽ hiện khi mốc đúng vị trí.</p><ol class="tg-ds" id="tg"></ol><button class="btn chinh" id="tg-kt">✓ Kiểm tra</button> <span class="goi-y" id="tg-kq"></span></div>' +
      '<div class="the"><h3>② Sơ đồ tư duy</h3><div class="mm-wrap"><div><p class="goi-y" style="margin-top:0">＋ thêm nhánh · 📎 đính kèm tệp / chèn liên kết · 🗑 xoá nhánh. Bấm vào nhãn đính kèm để gỡ.</p><div id="cay"></div></div><div><svg class="so-do" id="so-do" viewBox="0 0 960 540" role="img" aria-label="Sơ đồ tư duy của nhóm"></svg><p class="goi-y" id="mm-tk"></p></div></div></div>' +
      '<div class="the"><h3>③ Khoảng cách thời gian giữa các mốc</h3><p class="goi-y" style="margin-top:0">Tính số năm giữa hai mốc liên tiếp (<b>năm sau − năm trước</b>) rồi nhập vào ô; tự tính, không dùng máy tính bỏ túi nhé! Trong bảng tính, đây là công thức <code>=B3-B2</code>.</p>' +
      '<div class="kp-cuon" id="kc"></div><p class="goi-y" id="kc-kq"></p></div>';
    var $ = function (s) { return hop.querySelector(s); };

    /* ---- dòng thời gian ---- */
    function veTg(kt) {
      $("#tg").innerHTML = W.tg.map(function (m, i) {
        var M = MOC[m], dung = W.tgKt && m === i;
        return '<li class="' + (W.tgKt ? (dung ? "dung" : "sai") : "") + '"><span class="nam">' + (dung ? M.n : "?") + '</span><span class="mo"><b>' + M.t + "</b><small>" + M.m + '</small></span><span class="nut"><button data-tg="' + i + '" data-d="-1" aria-label="Đưa ' + M.t + ' lên">↑</button><button data-tg="' + i + '" data-d="1" aria-label="Đưa ' + M.t + ' xuống">↓</button></span></li>';
      }).join("");
    }
    hop.addEventListener("click", function (e) {
      var b = e.target.closest("[data-tg]"); if (!b) return;
      var i = +b.dataset.tg, j = i + +b.dataset.d; if (j < 0 || j >= W.tg.length) return;
      var t = W.tg[i]; W.tg[i] = W.tg[j]; W.tg[j] = t; W.tgKt = false; api.luu(); veTg(); veKc(); $("#tg-kq").textContent = "";
    });
    $("#tg-kt").addEventListener("click", function () {
      W.tgKt = true; var d = W.tg.filter(function (m, i) { return m === i; }).length;
      $("#tg-kq").textContent = d === MOC.length ? "🎉 Đúng hết " + d + " mốc!" : "Đúng " + d + "/" + MOC.length + " mốc. Đọc lại thẻ Khoa học ở Bước 2.";
      api.dat("tg", d === MOC.length); api.luu(); veTg(); veKc();
    });

    /* ---- sơ đồ tư duy ---- */
    function nutTai(p) { var n = W.mm; p.forEach(function (i, k) { n = (k === 0 ? n.nhanh : n.con)[i]; }); return n; }
    function veCay() {
      function dong(n, p, cap) {
        var key = p.join("-");
        var h = '<li><div class="nut-cay' + (cap === 0 ? " goc" : "") + '"><input data-ten="' + key + '" value="' + esc(n.ten) + '" aria-label="' + (cap === 0 ? "Chủ đề trung tâm" : "Tên nhánh") + '" placeholder="' + (cap === 1 ? "Nhánh chính" : "Nhánh con") + '">' +
          (cap < 2 ? '<button data-them="' + key + '" title="Thêm ' + (cap === 0 ? "nhánh chính" : "nhánh con") + '">＋</button>' : "") +
          (cap > 0 ? '<button data-dk="' + key + '" title="Đính kèm tệp / chèn liên kết">📎</button><button data-xoa="' + key + '" title="Xoá nhánh">🗑</button>' : "") + "</div>";
        if (n.dk && n.dk.length) h += '<div class="dk-ds">' + n.dk.map(function (d, i) { return '<span data-go="' + key + '" data-i="' + i + '" title="Bấm để gỡ">' + (d[0] === "tep" ? "📎 " : "🔗 ") + esc(d[1]) + "</span>"; }).join("") + "</div>";
        if (moDk === key) h += '<div class="hop-dk"><select id="dk-chon">' + TEP.map(function (t, i) { return '<option value="' + i + '">' + (t[0] === "tep" ? "📎 Insert/Attachment: " : "🔗 Insert/Hyperlink: ") + esc(t[1]) + "</option>"; }).join("") + '</select><button class="btn nho chinh" id="dk-ok">Chèn</button><button class="btn nho" id="dk-huy">Huỷ</button></div>';
        var con = cap === 0 ? n.nhanh : n.con;
        if (con && con.length) h += "<ul>" + con.map(function (c, i) { return dong(c, p.concat(i), cap + 1); }).join("") + "</ul>";
        return h + "</li>";
      }
      $("#cay").innerHTML = '<ul class="cay">' + dong(W.mm, [], 0) + "</ul>";
    }
    function veSoDo() {
      var VW = 960, VH = 540, cx = VW / 2, cy = VH / 2, s = "", lop = "", nh = W.mm.nhanh, N = nh.length;
      var MAU = ["#2563eb", "#16a34a", "#ea580c", "#9333ea", "#db2777", "#0891b2", "#ca8a04", "#4f46e5"];
      function nhan(x, y, t, mau, dk, to) {
        var tt = (t || "…").slice(0, 26), w = Math.max(60, tt.length * (to ? 8.4 : 7) + 22 + (dk ? 22 : 0));
        x = Math.max(w / 2 + 4, Math.min(VW - w / 2 - 4, x));
        return '<g><rect x="' + (x - w / 2) + '" y="' + (y - (to ? 17 : 13)) + '" width="' + w + '" height="' + (to ? 34 : 26) + '" rx="' + (to ? 17 : 13) + '" fill="' + (to ? mau : "#fff") + '" stroke="' + mau + '" stroke-width="2"/>' +
          '<text x="' + (x + (dk ? -10 : 0)) + '" y="' + (y + 5) + '" text-anchor="middle" font-size="' + (to ? 14 : 12.5) + '" font-weight="' + (to ? 700 : 600) + '" fill="' + (to ? "#fff" : "#0f172a") + '">' + esc(tt) + "</text>" +
          (dk ? '<text x="' + (x + w / 2 - 16) + '" y="' + (y + 5) + '" text-anchor="middle" font-size="12">' + dk + "</text>" : "") + "</g>";
      }
      function bieu(n) { if (!n.dk || !n.dk.length) return ""; var t = n.dk.some(function (d) { return d[0] === "tep"; }), l = n.dk.some(function (d) { return d[0] === "link"; }); return (t ? "📎" : "") + (l ? "🔗" : ""); }
      nh.forEach(function (b, i) {
        var g = -Math.PI / 2 + i * 2 * Math.PI / N, mau = MAU[i % MAU.length];
        var cg = Math.cos(g), sg = Math.sin(g), doc = Math.abs(sg) > Math.abs(cg) + 0.01;
        var bx = cx + cg * 255, by = cy + sg * 150;
        s += '<path d="M' + cx + " " + cy + " Q" + (cx + cg * 130) + " " + (cy + sg * 40) + " " + bx + " " + by + '" stroke="' + mau + '" stroke-width="5" fill="none" stroke-linecap="round" opacity=".75"/>';
        var con = b.con || [], M = con.length;
        con.forEach(function (c, j) {
          var lech = j - (M - 1) / 2, x, y;
          if (doc) { x = bx + lech * 165 + cg * 60; y = by + (sg > 0 ? 72 : -72); }
          else { x = bx + (cg > 0 ? 175 : -175); y = by + lech * 38 + sg * 30; }
          y = Math.max(16, Math.min(VH - 16, y));
          s += '<line x1="' + bx + '" y1="' + by + '" x2="' + x + '" y2="' + y + '" stroke="' + mau + '" stroke-width="2"/>';
          lop += nhan(x, y, c.ten, mau, bieu(c), false);
        });
        lop += nhan(bx, by, b.ten, mau, bieu(b), true);
      });
      s += lop + '<g><ellipse cx="' + cx + '" cy="' + cy + '" rx="122" ry="36" fill="#1e1b4b"/><text x="' + cx + '" y="' + (cy + 5) + '" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">' + esc((W.mm.ten || "Chủ đề").slice(0, 30)) + "</text></g>";
      $("#so-do").innerHTML = s;
    }
    function demDk() {
      var t = 0, l = 0;
      function di(n) { (n.dk || []).forEach(function (d) { if (d[0] === "tep") t++; else l++; }); (n.con || n.nhanh || []).forEach(di); }
      di(W.mm); return { t: t, l: l };
    }
    function ktMm() {
      var nh = W.mm.nhanh.filter(function (b) { return (b.ten || "").trim(); });
      api.dat("st", !!(W.mm.ten || "").trim() && nh.length >= 4);
      api.dat("con", W.mm.nhanh.length >= 4 && W.mm.nhanh.every(function (b) { return (b.con || []).some(function (c) { return (c.ten || "").trim(); }); }));
      var d = demDk(); api.dat("dk", d.t >= 3 && d.l >= 1);
      $("#mm-tk").textContent = "Nhánh chính: " + W.mm.nhanh.length + " · Tệp đính kèm: " + d.t + " · Siêu liên kết: " + d.l;
      api.luu();
    }
    function veMm() { veCay(); veSoDo(); ktMm(); }
    var tach = function (k) { return k === "" ? [] : k.split("-").map(Number); };
    hop.addEventListener("click", function (e) {
      var b;
      if ((b = e.target.closest("[data-them]"))) {
        var p = tach(b.dataset.them), n = p.length ? nutTai(p) : W.mm;
        if (p.length === 0) { if (n.nhanh.length >= 8) { api.bao("Tối đa 8 nhánh chính."); return; } n.nhanh.push({ ten: "", con: [], dk: [] }); }
        else { n.con = n.con || []; if (n.con.length >= 4) { api.bao("Tối đa 4 nhánh con mỗi nhánh."); return; } n.con.push({ ten: "", dk: [] }); }
        api.luu(); veMm();
        var o = hop.querySelectorAll("#cay input"); var cuoi = p.length === 0 ? hop.querySelector('[data-ten="' + (n.nhanh.length - 1) + '"]') : hop.querySelector('[data-ten="' + p.concat(n.con.length - 1).join("-") + '"]'); if (cuoi) cuoi.focus();
      } else if ((b = e.target.closest("[data-xoa]"))) {
        var q = tach(b.dataset.xoa), cha = q.length === 1 ? W.mm.nhanh : nutTai(q.slice(0, -1)).con;
        var nn = cha[q[q.length - 1]];
        if ((nn.ten || (nn.con && nn.con.length)) && !confirm("Xoá nhánh “" + (nn.ten || "…") + "” và các nhánh con?")) return;
        cha.splice(q[q.length - 1], 1); moDk = null; api.luu(); veMm();
      } else if ((b = e.target.closest("[data-dk]"))) { moDk = moDk === b.dataset.dk ? null : b.dataset.dk; veCay(); }
      else if (e.target.id === "dk-huy") { moDk = null; veCay(); }
      else if (e.target.id === "dk-ok") {
        var nd = nutTai(tach(moDk)), t = TEP[+$("#dk-chon").value];
        nd.dk = nd.dk || [];
        if (nd.dk.some(function (d) { return d[1] === t[1]; })) { api.bao("Nhánh này đã có “" + t[1] + "”."); return; }
        nd.dk.push(t.slice()); moDk = null; api.luu(); veMm(); api.bao(t[0] === "tep" ? "Đã đính kèm tệp." : "Đã chèn siêu liên kết.");
      } else if ((b = e.target.closest("[data-go]"))) {
        var ng = nutTai(tach(b.dataset.go)); ng.dk.splice(+b.dataset.i, 1); api.luu(); veMm();
      }
    });
    hop.addEventListener("input", function (e) {
      var k = e.target.dataset.ten;
      if (k != null) { var p = tach(k); (p.length ? nutTai(p) : W.mm).ten = e.target.value; api.luu(); veSoDo(); ktMm(); return; }
      if (e.target.dataset.kc) { W.kc[e.target.dataset.kc] = e.target.value; api.luu(); ktKc(); }
    });

    /* ---- khoảng cách thời gian ---- */
    function so(v) { var t = String(v == null ? "" : v).replace(/[\s.,]/g, ""); return t === "" || isNaN(t) ? null : +t; }
    function tgDung() { return !!W.tgKt && W.tg.every(function (m, i) { return m === i; }); }
    var KC = MOC.slice(1).map(function (m, i) { return { k: String(i + 1), t: MOC[i].t + " (" + MOC[i].n + ") → " + m.t + " (" + m.n + ")", d: m.n - MOC[i].n }; })
      .concat([{ k: "tong", t: "<b>Cả chặng: " + MOC[0].t + " → " + MOC[MOC.length - 1].t + "</b>", d: MOC[MOC.length - 1].n - MOC[0].n }]);
    function veKc() {
      if (!tgDung()) { $("#kc").innerHTML = '<p class="trang-thai" style="margin:0">🔒 Sắp xếp đúng hết <b>① Dòng thời gian</b> và bấm Kiểm tra để mở bảng này.</p>'; $("#kc-kq").textContent = ""; api.dat("kc", false); return; }
      $("#kc").innerHTML = '<table class="kp"><thead><tr><th>Từ mốc → đến mốc</th><th>Số năm</th></tr></thead><tbody>' +
        KC.map(function (r) { return '<tr><td>' + r.t + '</td><td><input inputmode="numeric" data-kc="' + r.k + '" value="' + esc(W.kc[r.k] || "") + '" aria-label="Số năm: ' + esc(r.t.replace(/<[^>]+>/g, "")) + '"></td></tr>'; }).join("") + "</tbody></table>";
      ktKc();
    }
    function ktKc() {
      if (!tgDung()) { api.dat("kc", false); return; }
      var dung = 0;
      KC.forEach(function (r) {
        var v = so(W.kc[r.k]), o = hop.querySelector('[data-kc="' + r.k + '"]'), ok = v === r.d;
        if (o) { o.classList.toggle("dung", v != null && ok); o.classList.toggle("sai", v != null && !ok); }
        if (ok) dung++;
      });
      var dat = dung === KC.length;
      api.dat("kc", dat);
      $("#kc-kq").innerHTML = dat ? "✅ Đúng hết! Nhìn cột <b>Số năm</b>: các mốc gần đây cách nhau xa hay gần hơn các mốc đầu? Ghi nhận xét ở Bước 5." : "Đúng " + dung + "/" + KC.length + " ô. Ô đỏ là tính chưa đúng.";
    }

    veTg(); veMm(); veKc(); api.luu();

    return {
      cham: function (c) {
        var dTg = W.tg.filter(function (m, i) { return m === i; }).length, okTg = tgDung();
        var gt = [c.tl("b5-0"), c.tl("b5-1"), c.tl("b3-lydo")].join(" ");
        var coLk = /bánh răng|đèn điện tử|bán dẫn|mạch tích hợp|vi xử lí|vi xử lý/i.test(gt);
        var r1 = okTg ? (coLk ? { m: 3, ly: "Đúng thứ tự 7 mốc; câu trả lời có giải thích linh kiện của các thế hệ." } : { m: 2, ly: "Đúng thứ tự 7 mốc; chưa giải thích linh kiện từng thế hệ." }) :
          { m: 1, ly: W.tgKt ? "Mới đúng " + dTg + "/" + MOC.length + " mốc." : "Chưa bấm Kiểm tra dòng thời gian." };
        var nh = W.mm.nhanh, dk = demDk(), ba = ["st", "con", "dk"].filter(c.tc).length;
        var r2 = { m: ba === 3 ? 3 : c.tc("st") ? 2 : 1, ly: nh.length + " nhánh chính, " + dk.t + " tệp đính kèm, " + dk.l + " siêu liên kết" + (c.tc("con") ? "; nhánh nào cũng có nhánh con." : "; còn nhánh chính chưa có nhánh con.") };
        var nx = c.tieng("b5-1");
        var r3 = c.tc("kc") ? (nx >= 12 ? { m: 3, ly: "Tính đúng mọi khoảng cách và có nhận xét, giải thích ở Bước 5." } : { m: 2, ly: "Tính đúng mọi khoảng cách; chưa có nhận xét, giải thích." }) : { m: 1, ly: okTg ? "Còn ô khoảng cách tính sai hoặc chưa nhập." : "Bảng khoảng cách chưa mở (dòng thời gian chưa đúng)." };
        var rong = 0; (function di(n) { (n.nhanh || n.con || []).forEach(function (x) { if (!(x.ten || "").trim()) rong++; di(x); }); })(W.mm);
        if (rong) c.goi(3, "Sơ đồ có " + rong + " nhánh chưa đặt tên: đặt tên hoặc xoá 🗑.");
        if (okTg && !coLk) c.goi(4, "Câu 2 Bước 5: giải thích linh kiện từng thế hệ (bánh răng → đèn điện tử → bóng bán dẫn → mạch tích hợp) giúp máy tính nhỏ và nhanh dần thế nào.", "tl:b5-1");
        return {
          rub: [r1, r2, r3, c.thietKe(), c.hopTac()],
          cach: {
            tg: "Dùng ↑ ↓ sắp xếp lại (đang đúng " + dTg + "/" + MOC.length + " mốc), đọc lại thẻ Khoa học ở Bước 2, bấm Kiểm tra.",
            st: "Đặt tên chủ đề trung tâm và bấm ＋ cho đủ 4 nhánh chính (hiện có " + nh.length + ").",
            con: "Mỗi nhánh chính bấm ＋ thêm ít nhất 1 nhánh con có tên.",
            dk: "Dùng 📎 để đính kèm ít nhất 3 tệp (hiện " + dk.t + ") và chèn 1 siêu liên kết (hiện " + dk.l + ").",
            kc: okTg ? "Tính lại các ô đỏ hoặc còn trống: năm sau − năm trước." : "Sắp xếp đúng dòng thời gian để mở bảng, rồi tính số năm cho từng ô."
          }
        };
      },
      baoCao: function () {
        function ds(n, cap) {
          var con = cap === 0 ? n.nhanh : n.con || [];
          return "<li>" + esc(n.ten || "…") + (n.dk && n.dk.length ? " <i>(" + n.dk.map(function (d) { return (d[0] === "tep" ? "tệp " : "liên kết ") + esc(d[1]); }).join("; ") + ")</i>" : "") + (con.length ? "<ul>" + con.map(function (c) { return ds(c, cap + 1); }).join("") + "</ul>" : "") + "</li>";
        }
        return "<p><b>Dòng thời gian:</b> " + W.tg.map(function (m) { return MOC[m].t; }).join(" → ") + (W.tgKt ? "" : " <i>(chưa kiểm tra)</i>") + "</p>" +
          "<p><b>Sơ đồ tư duy:</b></p><ul>" + ds(W.mm, 0) + "</ul>" +
          "<p><b>Khoảng cách thời gian:</b></p><table><tr><th>Từ mốc → đến mốc</th><th>Số năm</th></tr>" +
          KC.map(function (r) { return "<tr><td>" + r.t + "</td><td>" + esc(W.kc[r.k] || "") + "</td></tr>"; }).join("") + "</table>";
      }
    };
  }
};
