<style>
.vuon-wrap { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 800px) { .vuon-wrap { grid-template-columns: 1fr; } }
.vuon { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; background: #a3d977; padding: 8px; border-radius: 14px; border: 3px solid #65a30d; }
.o-vuon { aspect-ratio: 1; background: #d9f99d; border-radius: 8px; display: grid; place-items: center; font-size: clamp(18px, 4.6vw, 30px); position: relative; }
.o-vuon.tram { background: #fde68a; }
.o-vuon.loi { background: #fecaca; box-shadow: inset 0 0 0 3px var(--loi); }
.o-vuon .rb { position: absolute; inset: 0; display: grid; place-items: center; transition: transform .25s; }
.o-vuon .rb .mui { position: absolute; top: -2px; left: 50%; margin-left: -7px; width: 0; height: 0; border: 7px solid transparent; border-bottom: 11px solid #1d4ed8; border-top: 0; }
.o-vuon .giot { position: absolute; right: 2px; top: 0; font-size: 14px; }
.chu-giai { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; color: var(--nhat); margin-top: 8px; }
.bang-lenh { display: flex; flex-wrap: wrap; gap: 6px; }
.bang-lenh .btn { font-size: 15px; }
.chuong-trinh { list-style: none; counter-reset: l; padding: 8px; margin: 10px 0; min-height: 64px; border: 2px dashed var(--vien); border-radius: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; background: #f8fafc; }
.chuong-trinh li { counter-increment: l; display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px 3px 6px; border-radius: 8px; background: #fff; border: 1px solid var(--vien); cursor: pointer; font-size: 14px; font-weight: 600; }
.chuong-trinh li::before { content: counter(l); font-size: 11px; color: var(--nhat); min-width: 14px; }
.chuong-trinh li.chon { border-color: var(--chinh); box-shadow: 0 0 0 2px var(--chinh-nhat); }
.chuong-trinh li.dang { background: #fef3c7; border-color: var(--vang); }
.chuong-trinh li.hong { background: var(--loi-nhat); border-color: var(--loi); }
.chuong-trinh .rong { color: var(--nhat); font-size: 14px; padding: 6px; }
.dieu-khien { display: flex; flex-wrap: wrap; gap: 6px; }
.trang-thai { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--chinh-nhat); font-size: 15px; }
.trang-thai.tot { background: var(--dat-nhat); }
.trang-thai.xau { background: var(--loi-nhat); }
.so-lieu { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.so-lieu span { background: #f1f5f9; border-radius: 99px; padding: 2px 10px; font-size: 14px; font-weight: 600; }
</style>

  xuong: function (hop, api) {

    var COT = 7, HANG = 5, GIOI_HAN = 32, MAX = 80;
    var DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0], HUONG = ["lên trên", "sang phải", "xuống dưới", "sang trái"];
    var LENH = { F: ["⬆️", "Đi thẳng"], L: ["↰", "Quay trái"], R: ["↱", "Quay phải"], T: ["💧", "Tưới cây"] };
    var CAY = [];

      '<div class="the"><h3>Thuật toán của nhóm</h3>' +
      '<div class="bang-lenh">' + Object.keys(LENH).map(function (k) { return '<button class="btn" data-them="' + k + '">' + LENH[k][0] + " " + LENH[k][1] + "</button>"; }).join("") + "</div>" +
      '<ol class="chuong-trinh" id="ct" aria-label="Danh sách lệnh"></ol>' +
      '<p class="goi-y" style="margin:-4px 0 8px">Bấm vào một lệnh để chọn: lệnh mới sẽ chèn ngay sau lệnh đó; nút ⌫ sẽ xoá lệnh đang chọn.</p>' +
      '<div class="dieu-khien"><button class="btn chinh" id="chay">▶ Chạy</button><button class="btn" id="buoc">⏭ Chạy từng bước</button><button class="btn" id="ve-dau">⟲ Về đầu</button><button class="btn" id="xoa">⌫ Xoá lệnh</button><button class="btn" id="xoa-het-l">🗑 Xoá hết</button></div>' +
      '<div class="so-lieu" id="so-lieu"></div><div class="trang-thai" id="tt">Thêm lệnh rồi bấm <b>Chạy</b>.</div></div></div>';

    var $ = function (s) { return hop.querySelector(s); };

    function batDau() { return { x: 0, y: 4, h: 0, i: 0, tuoi: {}, phi: 0, loi: null, oLoi: null }; }
    function oTai(x, y) { return (x < 0 || y < 0 || x >= COT || y >= HANG) ? "X" : BAN_DO[y][x]; }
    function buocMot(s) {
      var c = W.lenh[s.i];
      if (c === "L") s.h = (s.h + 3) % 4;
      else if (c === "R") s.h = (s.h + 1) % 4;
      else {
        var nx = s.x + DX[s.h], ny = s.y + DY[s.h], o = oTai(nx, ny);
        if (c === "F") {
          if (o === "X") { s.loi = "Robot đi ra ngoài vườn!"; }
          else if (o === "R") { s.loi = "Robot đâm vào đá!"; s.oLoi = nx + "," + ny; }
          else if (o === "P") { s.loi = "Robot giẫm lên bồn cây!"; s.oLoi = nx + "," + ny; }
          else { s.x = nx; s.y = ny; }
        } else if (c === "T") {
          var k = nx + "," + ny;
          if (o === "P" && !s.tuoi[k]) s.tuoi[k] = 1;
          else s.phi++;
        }
      }
      s.i++;
      return s;
    }

    function ve(s, dang) {
      var h = "";
      for (var y = 0; y < HANG; y++) for (var x = 0; x < COT; x++) {
        var o = BAN_DO[y][x], k = x + "," + y, nd = "";
        if (o === "P") nd = s.tuoi[k] ? "🌿<span class='giot'>💧</span>" : "🌱";
        else if (o === "R") nd = "🪨";
        else if (o === "S") nd = "🔌";
        if (s.x === x && s.y === y) nd += '<span class="rb" style="transform:rotate(' + (s.h * 90) + 'deg)"><span class="mui"></span><span style="transform:rotate(' + (-s.h * 90) + 'deg)">🤖</span></span>';
        h += '<div class="o-vuon' + (o === "S" ? " tram" : "") + (s.oLoi === k ? " loi" : "") + '">' + nd + "</div>";
      }
      $("#vuon").innerHTML = h;
      veCt(dang, s.loi ? s.i - 1 : -1);
      $("#so-lieu").innerHTML = "<span>Số lệnh: " + W.lenh.length + "</span><span>Đã tưới: " + Object.keys(s.tuoi).length + "/3</span><span>Tưới phí: " + s.phi + "</span><span>Hướng: " + HUONG[s.h] + "</span>";
    }
    function veCt(dang, hong) {
      var ct = $("#ct");
      if (!W.lenh.length) { ct.innerHTML = '<li class="rong" style="cursor:default;border:0;background:none">Chưa có lệnh nào.</li>'; return; }
      ct.innerHTML = W.lenh.map(function (c, i) {
        return '<li data-i="' + i + '" class="' + (i === chon ? "chon " : "") + (i === dang ? "dang " : "") + (i === hong ? "hong" : "") + '" title="' + LENH[c][1] + '">' + LENH[c][0] + " " + LENH[c][1] + "</li>";
      }).join("");
    }

    function ketThuc(s) {
      var du = Object.keys(s.tuoi).length === CAY.length;
      var ve_ = !s.loi && s.x === 0 && s.y === 4;
      api.dat("tuoi", du);
      api.dat("an", !s.loi && W.lenh.length > 0);
      api.dat("nuoc", du && s.phi === 0);
      api.dat("ve", du && ve_);
      api.dat("gon", du && ve_ && !s.loi && s.phi === 0 && W.lenh.length <= GIOI_HAN);
      W.kq = { n: W.lenh.length, tuoi: Object.keys(s.tuoi).length, phi: s.phi, ve: ve_, loi: s.loi };
      api.luu();
      var tt = $("#tt");
      if (s.loi) { tt.className = "trang-thai xau"; tt.innerHTML = "❌ " + s.loi + " (ở lệnh số " + s.i + "). Sửa lệnh đó rồi chạy lại."; }
      else if (api.datHet()) { tt.className = "trang-thai tot"; tt.innerHTML = "🎉 Tuyệt vời! Thuật toán đạt cả 5 tiêu chí với " + W.lenh.length + " lệnh."; }
      else {
        var thieu = [];
        if (!du) thieu.push("còn " + (CAY.length - Object.keys(s.tuoi).length) + " cây chưa tưới");
        if (s.phi) thieu.push("tưới phí nước " + s.phi + " lần");
        if (du && !ve_) thieu.push("robot chưa về trạm sạc");
        if (du && ve_ && !s.phi && W.lenh.length > GIOI_HAN) thieu.push("thuật toán dài " + W.lenh.length + " lệnh, cần không quá " + GIOI_HAN);
        tt.className = "trang-thai"; tt.innerHTML = "Robot chạy xong nhưng " + thieu.join("; ") + ".";
      }
    }

    var S = batDau();
    function dung() { clearTimeout(hen); dangChay = false; $("#chay").textContent = "▶ Chạy"; }
    function veDau() { dung(); S = batDau(); ve(S, -1); $("#tt").className = "trang-thai"; $("#tt").innerHTML = "Robot ở trạm sạc, quay mặt lên trên."; }

    $("#chay").addEventListener("click", function () {
      if (dangChay) { dung(); return; }
      if (!W.lenh.length) { api.bao("Hãy thêm lệnh trước."); return; }
      S = batDau(); dangChay = true; $("#chay").textContent = "⏸ Dừng";
      (function tiep() {
        if (S.i >= W.lenh.length || S.loi) { dung(); ve(S, -1); ketThuc(S); return; }
        buocMot(S); ve(S, S.loi ? -1 : S.i - 1);
        hen = setTimeout(tiep, 330);
      })();
    });
    $("#buoc").addEventListener("click", function () {
      dung();
      if (!W.lenh.length) { api.bao("Hãy thêm lệnh trước."); return; }
      if (S.i >= W.lenh.length || S.loi) S = batDau();
      buocMot(S); ve(S, S.loi ? -1 : S.i - 1);
      if (S.i >= W.lenh.length || S.loi) ketThuc(S);
      else { $("#tt").className = "trang-thai"; $("#tt").innerHTML = "Đã làm lệnh " + S.i + "/" + W.lenh.length + ": <b>" + LENH[W.lenh[S.i - 1]][1] + "</b>."; }
    });
    $("#ve-dau").addEventListener("click", veDau);
    $("#xoa").addEventListener("click", function () {
      if (!W.lenh.length) return;
      var i = chon != null ? chon : W.lenh.length - 1;
      W.lenh.splice(i, 1); chon = chon != null ? (i > 0 ? i - 1 : (W.lenh.length ? 0 : null)) : null;
      api.luu(); veDau();
    });
    $("#xoa-het-l").addEventListener("click", function () {
      if (!W.lenh.length || !confirm("Xoá toàn bộ thuật toán?")) return;
      W.lenh = []; chon = null; api.luu(); veDau();
    });
    hop.addEventListener("click", function (e) {
      var b = e.target.closest("[data-them]");
      if (b) {
        if (W.lenh.length >= MAX) { api.bao("Tối đa " + MAX + " lệnh."); return; }
        if (chon != null) { W.lenh.splice(chon + 1, 0, b.dataset.them); chon++; } else W.lenh.push(b.dataset.them);
        api.luu(); veDau(); return;
      }
      var li = e.target.closest("#ct li[data-i]");
      if (li) { var i = +li.dataset.i; chon = chon === i ? null : i; veCt(-1, -1); }
    });
    veDau();

    return {
      cham: function (c) {
        var k = W.kq, n = W.lenh.length;
        var dung = c.tc("tuoi") && c.tc("an") && c.tc("nuoc") && c.tc("ve");
        var r1 = !k ? { m: 1, ly: "Nhóm chưa chạy thử thuật toán." } :
          dung ? { m: 3, ly: "Robot tưới đủ 3 cây, an toàn, không tưới phí nước và về trạm sạc." } :
          c.tc("tuoi") && !k.loi ? { m: 2, ly: "Tưới đủ 3 cây nhưng " + (k.phi ? "tưới phí nước " + k.phi + " lần" : "") + (k.phi && !k.ve ? " và " : "") + (!k.ve ? "chưa về trạm sạc" : "") + "." } :
          { m: 1, ly: k.loi ? "Robot gặp lỗi: " + k.loi : "Mới tưới " + k.tuoi + "/3 cây." };
        var r2 = !dung ? { m: 1, ly: "Thuật toán chưa đúng nên chưa xét độ ngắn gọn" + (n ? " (hiện " + n + " lệnh)." : ".") } :
          n <= GIOI_HAN ? { m: 3, ly: n + " lệnh, không quá " + GIOI_HAN + "." } : n <= 40 ? { m: 2, ly: n + " lệnh (từ 33 đến 40)." } : { m: 1, ly: n + " lệnh (trên 40)." };
        var vr = c.tl("b1-1"), coVR = /(đầu\s*vào|input)/i.test(vr) && /(đầu\s*ra|output)/i.test(vr), mt = c.tieng("b3-1");
        var r3 = coVR && mt >= 15 ? { m: 3, ly: "Nêu đầu vào, đầu ra và mô tả thuật toán bằng lời (" + mt + " tiếng)." } :
          coVR || c.tieng("b1-1") >= 6 ? { m: 2, ly: "Có nêu đầu vào, đầu ra; mô tả thuật toán bằng lời còn ngắn (" + mt + " tiếng)." } : { m: 1, ly: "Chưa nêu rõ đầu vào, đầu ra." };
        if (!k) c.goi(3, "Bấm <b>▶ Chạy</b> để thử thuật toán của nhóm.");
        else if (k.loi) c.goi(3, "Robot gặp lỗi “" + k.loi + "”. Dùng <b>⏭ Chạy từng bước</b> để tìm lệnh gây lỗi (lệnh tô đỏ) rồi sửa.");
        var thua = [], L = W.lenh;
        for (var i = 0; i + 1 < n; i++) if ((L[i] === "L" && L[i + 1] === "R") || (L[i] === "R" && L[i + 1] === "L")) thua.push("lệnh " + (i + 1) + "–" + (i + 2) + ": quay rồi quay ngược lại, bỏ cả hai");
        for (var j = 0; j + 2 < n; j++) if ((L[j] === "L" || L[j] === "R") && L[j] === L[j + 1] && L[j] === L[j + 2]) thua.push("lệnh " + (j + 1) + "–" + (j + 3) + ": 3 lần " + LENH[L[j]][1] + " bằng 1 lần " + (L[j] === "L" ? "Quay phải" : "Quay trái"));
        if (thua.length) c.goi(3, "Có lệnh quay thừa, rút gọn được: " + thua.slice(0, 3).join("; ") + ".");
        if (!coVR) c.goi(0, "Câu 2 Bước 1: ghi rõ <b>đầu vào</b> (bản đồ vườn, vị trí, hướng của robot…) và <b>đầu ra</b> (3 cây đã tưới, robot ở trạm sạc).", "tl:b1-1");
        if (mt < 15) c.goi(2, "Viết phác thảo thuật toán bằng lời đầy đủ hơn, theo thứ tự: Bước 1…, Bước 2…", "tl:b3-1");
        return {
          rub: [r1, r2, r3, c.hopTac()],
          boQuaTc: !k,
          cach: {
            tuoi: "Robot phải đứng cạnh, <b>quay mặt vào</b> bồn cây rồi mới Tưới." + (k ? " Lần chạy gần nhất tưới được " + k.tuoi + "/3 cây." : ""),
            an: "Không cho robot đi vào ô đá, bồn cây hoặc ra ngoài vườn; chạy từng bước để thấy lệnh gây va chạm.",
            nuoc: "Tìm lệnh Tưới mà ô trước mặt robot không phải bồn cây chưa tưới" + (k && k.phi ? " (có " + k.phi + " lần tưới phí)" : "") + ", rồi xoá hoặc dời lệnh đó.",
            ve: "Thêm lệnh để robot về trạm sạc (ô góc dưới bên trái) sau khi tưới xong.",
            gon: "Thuật toán đang có " + n + " lệnh: thử thứ tự tưới khác hoặc bỏ lệnh quay thừa để còn không quá " + GIOI_HAN + " lệnh."
          }
        };
      },
      baoCao: function () {
        var k = W.kq;
        return "<p><b>Thuật toán (" + W.lenh.length + " lệnh):</b></p><ol>" + W.lenh.map(function (c) { return "<li>" + LENH[c][1] + "</li>"; }).join("") + "</ol>" +
          (k ? "<p><b>Lần chạy gần nhất:</b> tưới " + k.tuoi + "/3 cây; tưới phí " + k.phi + " lần; " + (k.loi ? "lỗi: " + k.loi : (k.ve ? "đã về trạm sạc" : "chưa về trạm sạc")) + ".</p>" : "<p><i>Chưa chạy thử.</i></p>");
      }
    };
  }
};
</script>
